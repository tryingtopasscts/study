t exactly the same between firms, so the legend is the authority — and it's what the team lead would point to anyway.","id":113,"s":"test"},{"t":13,"q":"While evaluating a site environment, a room appears to suffer from reverberation. What treatment could be recommended to improve the acoustics in the room?","o":["Replace carpets with laminated flooring.","Use soft furnishings and flooring.","Add an acoustic mirror to one end of the room.","Replace curtains with blinds."],"a":1,"e":"Sound-absorbing materials determine whether the sound is intelligible. Soft furnishings and flooring absorb reflections; hard surfaces (laminate, blinds, mirrors) make reverberation worse.","id":114,"s":"test"},{"t":13,"q":"What measurement tool is used for measuring ambient light in a teaching environment?","o":["Incident Light Meter","Incremental Light Meter","Spot Photometer","Color Spectrometer"],"a":0,"e":"The incident light meter measures light just before it lands on an object. Use it at the screen position to discover how dark the projection screen location is.","id":115,"s":"test"},{"t":13,"q":"When is it necessary to perform a site evaluation in an AV project?","o":["Only when the project involves new construction.","When the initial site survey is conducted remotely.","Before beginning any AV project.","When gathering customer information."],"a":2,"e":"Evaluating the site environment is necessary before starting any AV project to validate information, identify design ideas and constraints, and compare the initial site survey checklist with the physical project location.","id":116,"s":"test"},{"t":5,"q":"Projectors may use different lamp technologies for different reasons. For long life without changing the light source, which technology is preferred?","o":["Halogen lamp","Fluorescent lamp","LED lamp","Arc lamp"],"a":2,"e":"LED lamps have a higher efficiency rating when converting electricity into light, and last far longer than halogen or arc lamps.","id":117,"s":"test"},{"t":5,"q":"What factor determines the maximum off-axis viewer position from which the images on screen are legible?","o":["Viewing distance","Viewing angle","Contrast ratio","Throw distance"],"a":1,"e":"Viewing angle is the angle at which viewers can still see the screen without compromising legibility — it sets the widest usable seat position.","id":118,"s":"test"},{"t":9,"q":"A wall mounted assistive listening system transmitter has its 12 V, 1.8 A, DC power supply remotely located in the AV rack 25 feet away. What is the voltage drop attributable to the 18 AWG power extension wire used which has a resistance of .0062 ohms per foot, and will this be within a 5% voltage operating tolerance for the ALS transmitter?","o":["1.86 volts and is in tolerance","0.558 volts and is in tolerance","1.86 volts and is out of tolerance","0.558 volts and is out of tolerance"],"a":1,"e":"The current travels out and back, so the wire length is 25 x 2 = 50 ft. R = 50 x 0.0062 = 0.31 ohms. V = I x R = 1.8 x 0.31 = 0.558 V. Tolerance: 5% of 12 V = 0.6 V, so 0.558 V is (just) in tolerance.","id":119,"s":"test"},{"t":9,"q":"When selecting a DC power supply that has to run a long distance, what must be considered?","o":["RF interference","Voltage drop","Cable capacitance","Inductance"],"a":1,"e":"Voltage drop is always a concern, as a cable has resistance over distance.","id":120,"s":"test"},{"t":19,"q":"During the design process, a conflict arises between what has been communicated and what is observed in the facility drawings. How should this issue be resolved?","o":["Call the general contractor and verbally get a confirmation.","Consult other designers and make design decisions based on best practices.","Submit a RFI (request for information) to the general contractor.","Create a CO (change order) and submit to the general contractor."],"a":2,"e":"Submit an RFI — always get it in writing, even if you never get a response. Projects are complicated and people forget what they were told; written replies can also be forwarded to others on the project. Verbal answers can't.","id":121,"s":"test"},{"t":4,"q":"Which of the following is TRUE of a decibel?","o":["It is a measure of loudness.","When calculating a decibel a 20 log function for power would be utilized.","When calculating a decibel a 10 log function for sound pressure would be utilized.","It is a logarithmic value of a ratio that represents the relative change from one value to another value."],"a":3,"e":"A decibel is a logarithmic value of a ratio representing relative change. Watch the traps: power uses 10 log, voltage/sound pressure use 20 log — the other options have them backwards.","id":122,"s":"test"},{"t":4,"q":"When comparing loudspeakers, which specification defines the efficiency of the loudspeaker?","o":["Loudness","Frequency response","Polar plot","Sensitivity"],"a":3,"e":"Sensitivity defines the efficiency of a loudspeaker — how effectively it converts input power into sound output.","id":123,"s":"test"},{"t":4,"q":"A school gymnasium is being converted into a multipurpose space with a stage area at one end. A cluster loudspeaker system over the front of the stage is mounted 9 m from the floor. The distance from the cluster to the D2 listener is 20 m, and to the D3 listener is 40 m. What is the decibel difference between the D3 position and the D2 position?","o":["-6dB","3dB","6dB","12dB"],"a":2,"e":"Inverse square law: dB = 20log(40/20) = 6 dB. Doubling the distance costs 6 dB, so the middle (D2) position is 6 dB louder than the farthest (D3) position.","id":124,"s":"test"},{"t":4,"q":"What is the BEST practice for deciding between unbalanced and balanced audio cables?","o":["Use unbalanced for cables under 25 ft (7.6 m).","Use unbalanced for cables under 30 ft (9.1 m).","Use balanced for all cables over 50 ft (15.2 m).","Use balanced for all cables."],"a":3,"e":"It is always the best choice to use balanced cables to avoid interference in the signal — not just past some length threshold.","id":125,"s":"test"},{"t":4,"q":"An average human adult can hear from 20Hz to 20kHz. How many octaves does that range encompass?","o":["6 octaves","8 octaves","10 octaves","12 octaves"],"a":2,"e":"There are ten octaves between 20 Hz and 20,000 Hz (an octave is a doubling). The center frequencies are, in Hz: 31.25, 62.5, 125, 250, 500, 1000, 2000, 4000, 8000, 16000.","id":126,"s":"test"},{"t":15,"q":"During the stakeholder meeting to present the program report, the AV Sales Manager realizes that some stakeholders have questions beyond the scope of the report. What should the manager do?","o":["Ignore the additional questions to keep the meeting focused on the report.","Politely inform the stakeholders that their questions are outside the meeting's agenda.","Address the additional questions and assure stakeholders that their concerns will be considered.","Adjourn the meeting and schedule another session specifically for addressing additional questions."],"a":2,"e":"Questions should be addressed and discussed. If the answers sustainably change the scope or program report, the report should be amended, presented again, and finally accepted and signed off.","id":127,"s":"test"},{"t":15,"q":"During a project planning meeting for an AV project scope development, the team is discussing the technology trends relevant to end-user needs. Which of the following actions should the team take?","o":["Focus the discussion on the latest AV equipment available in the market.","Ensure the discussion aligns with the specific needs and goals of end users.","Discuss general technology advancements unrelated to the project.","Skip the discussion on technology trends as it may confuse stakeholders."],"a":1,"e":"It is important to know if the client's technology goals are being addressed. Some end users upgrade systems in a scheduled cycle that can take years — knowing the technology direction is very helpful during the needs analysis.","id":128,"s":"test"},{"t":15,"q":"Which of the following statements accurately describes the purpose of compiling information for an AV project scope?","o":["To prioritize tasks based on budget constraints.","To gather data for the AV project manager's reference.","To ensure the proposed system meets the needs of stakeholders.","To document the architectural layout of the building."],"a":2,"e":"The proposed solution in the program report must directly meet the needs of the end-user. Project planning meetings include the needs assessment, priorities, and discussions of possible solutions.","id":129,"s":"test"},{"t":15,"q":"When working with a client to design an AV solution for a new conference center, the client requests a detailed budget for the equipment and installation. In what phase does this occur?","o":["Design phase","Program phase","Bidding phase","Installation phase"],"a":0,"e":"A detailed list of equipment and installation labor is known as a bill of materials, and it is generated during the design phase of an AV project. The program phase produces only a rough overall budget.","id":130,"s":"test"},{"t":15,"q":"Near the end of the installation, the client claims that an entire portion of the project hasn't even started. You are unfamiliar with what is being brought up. Which document will be the BEST place to look regarding this discrepancy?","o":["The program report.","The system diagram.","The bill of materials.","The logic network diagram."],"a":0,"e":"The program report discusses the needs of the client and the solution that addresses them — whatever portion is missing should be written there. The project design has more detail, and any change orders created since the project started are also worth reviewing.","id":131,"s":"test"},{"t":15,"q":"Which phase comes first in a project?","o":["Commissioning and training phase","The design phase","The program phase","The construction phase"],"a":2,"e":"The program phase comes first — its purpose is to discuss, clarify, and document the owner's needs, concerns, expectations, and constraints to guide the design team on the functionality and cost of the AV systems.","id":132,"s":"test"},{"t":17,"q":"What is the main responsibility of the lead technician during system commissioning?","o":["Finalizing the project budget.","Ensuring compliance with building codes.","Making corrections based on checklist items.","Creating operational documentation."],"a":2,"e":"During the commissioning phase, the lead technician finalizes system settings and closes out any open issues on the checklist.","id":133,"s":"test"},{"t":17,"q":"While conducting system commissioning, the lead technician discovers that several cables are not properly labeled, making it difficult to identify connections. What action should the lead technician take?","o":["Ignore the unlabeled cables as they are not critical to system operation.","Proceed with commissioning and address the labeling issue later.","Immediately label the cables to ensure proper identification.","Inform the client about the labeling issue and wait for further instructions."],"a":2,"e":"Any label is better than no label. It is best to label cables using the cable labeling standard; however, a handwritten label is better than none.","id":134,"s":"test"},{"t":17,"q":"What is the minimum load safety rating for mounting audio-visual equipment?","o":["3:1","5:1","8:1","10:1"],"a":1,"e":"A 5:1 safety factor should be considered whenever mounting AV equipment. The weight of the equipment and the mount itself are added together and then multiplied by 5.","id":135,"s":"test"},{"t":17,"q":"When checking into the jobsite, it may be necessary to pass security checks. Which of the following will MOST likely need to be provided?","o":["Business card with company name and address.","Name and phone number of a contact on site.","Government-issued picture ID","A letter from the general contractor indicating authorization to be onsite."],"a":2,"e":"Verifying identity with a government-issued picture ID will most likely be the first step. Other items may be needed as well.","id":136,"s":"test"},{"t":17,"q":"During system commissioning, the lead technician discovers that one of the projectors is not displaying images properly. After troubleshooting, it is determined that the issue is due to a faulty cable connection. What is the next step the lead technician should take?","o":["Replace the projector with a new one.","Inform the client about the issue and its resolution.","Ignore the issue as it is minor and won't affect system functionality.","Document the problem and report it to the project manager for further action."],"a":3,"e":"Documenting the condition is the appropriate action. It gets added to the list of tasks to be completed — it could be a simple or a more complicated repair.","id":137,"s":"test"},{"t":17,"q":"When mounting equipment, many times standard screws are replaced with security screws. What is the MAIN purpose of security screws?","o":["To slow down would-be thieves.","They are stronger screws and will secure the device to the wall.","They will lockout people from attempting to tamper with the equipment.","These screws work with an alarm system and make a siren sound when disturbed."],"a":0,"e":"Security screw bits are easily purchased, but not many people have them. Someone intent on stealing the equipment can still get the tools — security screws just slow them down.","id":138,"s":"test"},{"t":19,"q":"When speaking with the client, the project manager notices that some work expected to be done has not been completed by the integrator. How should the Project Manager address this issue?","o":["Come to a verbal agreement with the integrator to resolve the issues.","Write down and send a list of the items to be addressed to the integrator.","Have your employees resolve the issues after the integrator is gone.","Wait until the project is complete and then address the issues with the integrator."],"a":1,"e":"Sending a written list of items to be addressed ensures clear communication and documentation of the outstanding tasks, facilitating efficient resolution.","id":139,"s":"test"},{"t":19,"q":"During the installation of the AV system, the general contractor requires a change for safety reasons. What document is submitted for this request?","o":["Request for Change (RFC)","Change Order (CO)","Construction Change Directive (CCD)","Implementation Order (IO)"],"a":2,"e":"A Construction Change Directive (CCD) is used for time-critical work such as safety changes — it bypasses the normal RFC-to-CO approval chain.","id":140,"s":"test"},{"t":19,"q":"During the construction of commercial buildings, many different events can occur that can affect the project, such as weather delays, logistical issues, labor shortages, and financial challenges. How should risks be managed in a commercial AV project?","o":["Identify and mitigate risks with a comprehensive plan.","Rely on past experiences to assume low project risks.","Emphasize risks only if they affect the project's aesthetics.","Focus risk management efforts on equipment faults."],"a":0,"e":"Identify and mitigate risks with a comprehensive plan, including a risk register, a risk matrix, and mitigation alternatives.","id":141,"s":"test"},{"t":18,"q":"What is the primary objective of training end users and support staff on the operation of an AV system?","o":["Eliminate the need for a service contract.","Increase the possibility of equipment damage due to improper use.","Increase the number of service calls due to preventable issues (i.e. user errors).","Build up user confidence in the equipment and provide a positive user experience."],"a":3,"e":"Proper training builds user confidence and a positive experience. Service calls and malfunctions may still happen, but training reduces the preventable ones.","id":142,"s":"test"},{"t":18,"q":"When coordinating AV operations, which allied trade should you consider MOST critical for effective integration?","o":["Electrical","Plumbing","Security","HVAC"],"a":0,"e":"While all listed trades are important, electrical coordination is often the most critical for AV operations to ensure power supply and signal integrity.","id":143,"s":"test"},{"t":18,"q":"During the setup for a major event, a shortage of wireless microphones is realized due to unexpectedly high demand. The event requires 12 wireless microphones, but only 8 are available. What is the most effective way to manage this shortage?","o":["Inform the event organizers that only 8 microphones will be available and proceed without making further adjustments.","Rent additional wireless microphones from a local supplier.","Reconfigure the schedule to ensure that the 8 available microphones are shared across sessions with minimal overlap.","Substitute the remaining microphones with wired ones and explain the situation to the users."],"a":1,"e":"Renting additional wireless microphones ensures all needs are met without compromising the quality or functionality of the AV setup — a proactive approach that maintains the event's professional standards.","id":144,"s":"test"},{"t":20,"q":"What document provides a detailed record of all repairs and service work associated with the audio-visual systems?","o":["Service manual","Repair guide","Maintenance log","As built drawings"],"a":2,"e":"The maintenance log has the service dates, the work performed, and the equipment or system that was serviced.","id":145,"s":"test"},{"t":21,"q":"What risk does an AV project face if the contract terms are not followed or are changed?","o":["Voiding the warranty.","Improved system performance.","Reduced project costs.","Faster project timeline."],"a":0,"e":"Not following the stipulations of the warranty or changing the contract terms can void the warranty, leaving the project without coverage for repairs or replacements under the original terms.","id":146,"s":"test"},{"t":21,"q":"A component fails in the first month after an install. What is the BEST mechanism for the client to have it replaced?","o":["Manufacturers warranty","System warranty","Service agreement","Purchase a new component"],"a":0,"e":"The manufacturer's warranty typically covers defects and failures within an initial period, providing a cost-free replacement or repair.","id":147,"s":"test"},{"t":22,"q":"An AV professional is shopping at a store, and notices there is an audible hiss coming from the background music loudspeakers. What is a TOP reason for this hiss?","o":["Interference from the lighting fixtures.","Reception static coming from the receiver.","Improper gain structure of the sound system.","The use of balanced cabling and terminations."],"a":2,"e":"The gain entering the system is too low and the signal is boosted later in the chain, which also boosts the noise going to the loudspeakers — classic poor gain structure.","id":148,"s":"test"},{"t":22,"q":"The AV professional's team is preparing an AV system for a large conference scheduled to start in two hours. After performing the initial setup, intermittent audio dropouts from the speakers are noticed. Which is the BEST course of action to systematically troubleshoot and resolve this issue?","o":["Replace all audio cables to rule out faulty wiring.","Perform a signal test on each audio component, starting with the mixer and working towards the speakers.","Check and ensure all audio connectors are securely plugged in and the cables are properly routed to avoid interference.","Increase the gain levels on the mixer to compensate for any signal loss."],"a":1,"e":"The mixer is a halfway point in the system — a great place to confirm the inputs are making it in. Using headphones, each input can be monitored; if they sound good, focus on the output side of the system.","id":149,"s":"test"},{"t":22,"q":"A customer is reporting instances of 'distortion' in a recently installed and calibrated audio system. What is the FIRST thing that should be done?","o":["Replace all of the speakers in the system.","Turn the amplifiers to unity gain.","Check the gain structure of all audio signals in the system.","Recalibrate all of the acoustic echo cancellers."],"a":2,"e":"Check the gain structure of all audio signals in the system to ensure proper levels and clear audio performance.","id":150,"s":"test"},{"t":22,"q":"A client reports that the control panel in a boardroom is unresponsive. The system was rebooted, but the issue persists. What should be verified?","o":["That the network connectivity to the panel is correct","That the IR connection to the projector has not fallen","That the lectern equipment is powered on","That the panel was not switched with another meeting room"],"a":0,"e":"Verify network connectivity to the panel so that the panel and the rest of the system can communicate correctly.","id":151,"s":"test"},{"t":22,"q":"An instructor puts in a service ticket Monday morning. It says that everything in the training room was working on the Friday of the previous week. Now, on Monday morning, the video streaming system is down. Everything seems to be powered up. What is a major area to include in your troubleshooting?","o":["The audio amplifiers and loudspeaker chain.","All the cables in the rack, something may have been unplugged over the weekend.","The HDBaseT transport cables, transmitters, and receivers.","The private network port settings and access control list (ACL)."],"a":3,"e":"After confirming the AV gear is powered and seemingly working, bring in the network manager to see if maintenance was scheduled over the weekend. With the network settings (ports and protocols) documentation, the network manager can confirm whether anything changed on the network.","id":152,"s":"test"},{"t":22,"q":"What is the best practice to follow in the process of troubleshooting an AV system that isn't producing any sound and suspecting multiple potential causes within the system?","o":["Change several suspected components at once to save time.","Change only one component at a time and test after each change.","Restart the entire AV system to see if the problem resolves itself.","Replace the entire AV system with new equipment."],"a":1,"e":"Changing only one component at a time and testing after each change identifies the specific cause without introducing additional variables that could complicate troubleshooting.","id":153,"s":"test"},{"t":22,"q":"The simple presentation system, consisting of an HDMI cable and ceiling-mounted projector, has been working great for many years. Recently, the projector was upgraded to a 4K capable model. If the laptop outputs 1920x1080, everything works fine. If 4K is tried, the projector won't display it. What is the LIKELY cause of this intermittent behavior?","o":["HDCP (content protection) is enabled for all 4K outputs, this needs to be disabled.","The projector needs to have the 4K option enabled in the menu settings in the projector.","The laptop graphics card output needs to be adjusted in the display options settings.","The cable needs to be replaced with an Ultra High Speed HDMI cable."],"a":3,"e":"4K requires cables that can pass a very high bandwidth signal, and all cables have attenuation that reduces the level of the signal. Ultra High Speed HDMI cables are designed to pass 48 Gbps; usable cable lengths will vary.","id":154,"s":"test"},{"t":22,"q":"When assisting an end user who is experiencing intermittent display system failures, which of the following would be the best customer service follow-up question?","o":["What was being used just prior to the last failure?","Is the modulated cable resolution flag set to 'On'?","Can we discuss this later when we're not so busy?","If it doesn't happen frequently, can it be ignored?"],"a":0,"e":"Asking what was being used just prior to the last failure helps identify recent actions, applications, or devices that may have contributed to the issue, enabling a more accurate diagnosis.","id":155,"s":"test"},{"t":3,"q":"In a digital signal, the on state is represented by _____, and the off state is represented by ____.","o":["Two; one","One; two","Zero; one","One; zero"],"a":3,"e":"In a digital signal, the on state is represented by one, and the off state is represented by zero.","id":156,"s":"study"},{"t":3,"q":"A signal that has many varying states is called a(n) _____ signal.","o":["Analog","Fluctuating","Dimmer","Digital"],"a":0,"e":"A signal that has many varying states is an analog signal.","id":157,"s":"study"},{"t":3,"q":"Bit depth is defined as the number of _____ you have in which to describe the value.","o":["Signals","Speeds","States","Rates"],"a":2,"e":"Bit depth is defined as the number of states you have in which to describe the value.","id":158,"s":"study"},{"t":3,"q":"Lossy compression is particularly suitable for the transmission of _______.","o":["Spreadsheets","Text files","Financial data","Audio, video, and images"],"a":3,"e":"Lossy compression is particularly suitable for the transmission of audio, video, and images.","id":159,"s":"study"},{"t":3,"q":"What is a codec?","o":["A structure of data containment","A formatting system","A program that holds data","A device or processing system that encodes and decodes data"],"a":3,"e":"A codec is a device or processing system that encodes and decodes data.","id":160,"s":"study"},{"t":3,"q":"As noise is introduced along a(n) _____ signal path, processing circuitry can determine whether the signal is intended to be high or low and then retransmit a solid signal without the imposed noise.","o":["Digital","Dirty","Analog","Clean"],"a":0,"e":"As noise is introduced along a digital signal path, processing circuitry can determine whether the signal is intended to be high or low and then retransmit a solid signal without the imposed noise.","id":161,"s":"study"},{"t":3,"q":"Noise overcomes the signal after many generations of re-amplification of a(n) _____ signal.","o":["Digital","Analog","Low","High"],"a":1,"e":"Noise overcomes the signal after many generations of re-amplification of an analog signal.","id":162,"s":"study"},{"t":4,"q":"How sound moves through the air is called_____.","o":["Generation","Compression","Acoustical","Propagation"],"a":3,"e":"How sound moves through the air is called propagation.","id":163,"s":"study"},{"t":4,"q":"Wavelength is the _____.","o":["Number of times a wavelength cycle occurs per second","Intensity or loudness of a sound in a particular medium","Physical distance between two points of a waveform that are exactly one cycle apart","Cycle when molecules move from rest through compression to rest to rarefaction"],"a":2,"e":"Wavelength is the physical distance between two points of a waveform that are exactly one cycle apart.","id":164,"s":"study"},{"t":4,"q":"Which of the following does 0dB SPL describe?","o":["The threshold of human hearing","Ambient noise level","The threshold of pain","Normal listening level"],"a":0,"e":"0dB SPL describes the threshold of human hearing.","id":165,"s":"study"},{"t":4,"q":"A “just noticeable” change in sound pressure level, either louder or softer, requires a _____ change.","o":["+/–10dB","+/–6dB","+/–1dB","+/–3dB"],"a":3,"e":"A “just noticeable” change in sound pressure level, either louder or softer, requires a +/–3dB change.","id":166,"s":"study"},{"t":4,"q":"Acoustics covers how sound is _____, and its _____ and _____.","o":["Received; effects; structure","Produced; propagation; control","Controlled; delivery; translation","Produced; amplification; reception"],"a":1,"e":"Acoustics covers how sound is produced and its propagation and control.","id":167,"s":"study"},{"t":4,"q":"Numerous, persistent reflections of sound are called _____.","o":["Directional sound","Echo","Surface reflection","Reverberation"],"a":3,"e":"Numerous, persistent reflections of sound are called reverberation.","id":168,"s":"study"},{"t":4,"q":"Ambient noise is sound that _____ the desired message or signal.","o":["Interferes with","Completely blocks","Enhances","Is louder than"],"a":0,"e":"Ambient noise is sound that interferes with the desired message or signal.","id":169,"s":"study"},{"t":4,"q":"The audio signal ends up in a(n) _____ before being converted into acoustical energy.","o":["Output device","Electrical signal","Processor","Microphone"],"a":0,"e":"The audio signal ends up in an output device before being converted into acoustical energy.","id":170,"s":"study"},{"t":4,"q":"The strength of the electrical audio signal from a microphone is called a(n) _____ -level signal.","o":["Dynamic","Condenser","Electret","Mic"],"a":3,"e":"The strength of the electrical audio signal from a microphone is called a mic-level signal.","id":171,"s":"study"},{"t":4,"q":"Phantom power is the _____ required to power a condenser microphone.","o":["Polarized conductor","Electrical field","Remote power","Internal capacitor"],"a":2,"e":"Phantom power is the remote power required to power a condenser microphone.","id":172,"s":"study"},{"t":4,"q":"Typically, what type of connector finishes the shielded twisted-pair cable?","o":["XRL","RXL","LRX","XLR"],"a":3,"e":"An XLR connector typically finishes the shielded twisted-pair cable.","id":173,"s":"study"},{"t":4,"q":"The simultaneous use of multiple wireless microphone systems requires ____.","o":["Frequency coordination","Multiple receivers all tuned to the same frequency","Using lavalier microphones","Using IR wireless microphones"],"a":0,"e":"The simultaneous use of multiple wireless microphone systems requires frequency coordination.","id":174,"s":"study"},{"t":4,"q":"If a technician changes the level of a signal, it is called _____.","o":["Unity gain","Gain adjustment","Attenuation","Signal expansion"],"a":1,"e":"If a technician changes the level of a signal, it is called gain adjustment.","id":175,"s":"study"},{"t":4,"q":"The amplifier comes right before _____ in the audio system chain.","o":["The equalizer","Everything","The audio processor","The loudspeakers"],"a":3,"e":"The amplifier comes right before the loudspeakers in the audio system chain.","id":176,"s":"study"},{"t":4,"q":"What is a crossover?","o":["A loudspeaker containing multiple drivers","A loudspeaker enclosure with more than one frequency range","An electrical frequency dividing network circuit","A single driver reproducing the entire frequency range"],"a":2,"e":"A crossover is an electrical frequency–dividing network circuit.","id":177,"s":"study"},{"t":5,"q":"Electromagnetic radiation is categorized by its _____.","o":["Spectrum","Visibility","Vectors","Wavelength"],"a":3,"e":"Electromagnetic radiation is categorized by its wavelength.","id":178,"s":"study"},{"t":5,"q":"Generally, a _____ measurement of incident light is taken at a task area like a video screen.","o":["Lumen","LED","Foot-candle","Lux"],"a":3,"e":"Generally, a lux measurement of incident light is taken at a task area like a video screen.","id":179,"s":"study"},{"t":5,"q":"Illumination decreases by _____ when the distance from a light source is doubled.","o":["95 percent","75 percent","50 percent","25 percent"],"a":1,"e":"Illumination decreases by 75 percent when the distance from a light source is doubled.","id":180,"s":"study"},{"t":5,"q":"The amount of ambient light in a displayed environment _____.","o":["Negatively affects the quality of the displayed image","Does not affect the quality of the displayed image","Improves the quality of the displayed image","Complements the quality of the displayed image"],"a":0,"e":"The amount of ambient light in a displayed environment negatively affects the quality of the displayed image.","id":181,"s":"study"},{"t":5,"q":"The native resolution of display device is defined by its_______.","o":["Contrast ratio","Horizontal rows and vertical columns of pixels","Horizontal and vertical sync signals","Aspect ratio"],"a":1,"e":"The native resolution of display device is defined by its horizontal rows and vertical columns of pixels.","id":182,"s":"study"},{"t":5,"q":"According to the Projected Image System Contrast Ratio standard, what is the minimum contrast ratio required for viewing full-motion video?","o":["16:9","15:1","2.39:1","80:1"],"a":3,"e":"According to the Projected Image System Contrast Ratio standard, the minimum contrast ratio required for viewing full-motion video is 80:1.","id":183,"s":"study"},{"t":5,"q":"Four factors related to primary optics that influence the quality of the projected image are _____.","o":["Reflection, curvature, spherical aberration, and dispersion of field","Reflection, dispersion, spherical aberration, and curvature of field","Refraction, presentation, spherical aberration, and curvature of field","Refraction, dispersion, spherical aberration, and curvature of field"],"a":3,"e":"The four factors related to primary optics that influence the quality of the projected image are refraction, dispersion, spherical aberration, and curvature of field.","id":184,"s":"study"},{"t":5,"q":"Three of the major formats of digital signal connections are _____.","o":["DVI, HDVI, and DisplayPort","DMI, HDVI, and DisplayPort","DVI, HDMI, and DisplayPort","DMI, HDMI, and DisplayPort"],"a":2,"e":"Three of the major formats of digital video connections are DVI, HDMI, and DisplayPort.","id":185,"s":"study"},{"t":5,"q":"To measure the bandwidth of an image, you will need a _____.","o":["Spectrum analyzer","Frequency analyzer","Output monitor","Bandwidth monitor"],"a":0,"e":"To measure the bandwidth of an image, you will need a spectrum analyzer.","id":186,"s":"study"},{"t":5,"q":"Rear-screen display applications are considered _____.","o":["Remissive","Emissive","Transmissive","Reflective"],"a":2,"e":"Rear-screen display applications are considered transmissive.","id":187,"s":"study"},{"t":5,"q":"LCDs first pass light through a ____, which blocks certain light waves.","o":["Transistor mask","Polarizer","Pixel grid","Resistor network"],"a":1,"e":"LCDs first pass light through a polarizer, which blocks certain light waves.","id":188,"s":"study"},{"t":5,"q":"When selecting a display type, what should be your first step?","o":["Decide if you should use an analog or digital display","Figure out what type of mount you will need","Determine the distance of the farthest viewer","Determine what you want to display"],"a":3,"e":"When selecting a display type, your first step should be to determine what you want to display.","id":189,"s":"study"},{"t":5,"q":"The _____ the gain number of a projection screen, the _____ the image.","o":["Higher; brighter","Lower; sharper","Higher; softer","Lower; brighter"],"a":0,"e":"The higher the gain number of a projection screen, the brighter the image.","id":190,"s":"study"},{"t":5,"q":"What quality would the image have if the phase setting of a display needs adjusting?","o":["Blurry only at the image center","Oversaturation of red and green","Edge of image in sharp focus","Fuzzy details"],"a":3,"e":"If the phase setting of a display needs adjusting, the details of the image will be fuzzy.","id":191,"s":"study"},{"t":5,"q":"The formula for an ANSI lumen rating is _____.","o":["L=SH×SW×AI","L=SH×SW×AH","L=SH×SA×SF","L=SH×SW×AS"],"a":0,"e":"The formula for an ANSI lumen rating isL=SH×SW×AI.","id":192,"s":"study"},{"t":6,"q":"Which of the following network topologies connects devices in sequence along a linear path?","o":["Bus","Star","Mesh","Ring"],"a":0,"e":"A bus network connects devices in sequence along a linear path.","id":193,"s":"study"},{"t":6,"q":"Which IEEE standard defines Wi-Fi communications methods?","o":["802.1x","EIA-485","IPv6","802.11"],"a":3,"e":"The IEEE 802.11 standard defines Wi-Fi communications methods.","id":194,"s":"study"},{"t":6,"q":"What happens to the connection speed in a Wi-Fi connection if the signal strength declines?","o":["Speeds up","Stops","Slows down","Remains constant"],"a":2,"e":"The connection speed in a Wi-Fi connection slows down if the signal strength declines.","id":195,"s":"study"},{"t":6,"q":"Which of the following is a type of fiber-optic cable identified by its yellow outer jacket?","o":["ST","SC","Multimode","Single-mode"],"a":3,"e":"Single-mode fiber-optic cable can be identified by its yellow outer jacket.","id":196,"s":"study"},{"t":6,"q":"The _____ model is a guide that assists with conforming network communications and their processes to standards.","o":["Network interface","OSI reference","Informal data link","Asynchronous transfer mode"],"a":1,"e":"The OSI reference model is a guide that assists with conforming network communications and their processes to standards.","id":197,"s":"study"},{"t":6,"q":"In the OSI model, cabling and patchbays are elements of _____.","o":["Layer 2, the Data Link layer","Layer 4, the Transport layer","Layer 1, the Physical layer","Layer 3, the Network layer"],"a":2,"e":"In the OSI model, cabling and patchbays are elements of layer 1, the Physical layer.","id":198,"s":"study"},{"t":6,"q":"A _____ address is unique to every device and identifies a network’s equipment.","o":["Transfer mode","Baseband","Digital subscriber line","MAC"],"a":3,"e":"A MAC address is unique to every device and identifies a network’s equipment.","id":199,"s":"study"},{"t":6,"q":"IP deals with which of the following on a network?","o":["Addresses","Names","Routes","Versions"],"a":0,"e":"IP deals with addresses on a network.","id":200,"s":"study"},{"t":6,"q":"An IPv6 address uses _____ groups of four hexadecimal numbers.","o":["Three","Eight","Six","One"],"a":1,"e":"An IPv6 address uses eight groups of four hexadecimal numbers.","id":201,"s":"study"},{"t":6,"q":"Subnet masks can indicate how many _____ are allowed on the network.","o":["Computers","Gateways","Devices","Printers"],"a":2,"e":"Subnet masks can indicate how many devices are allowed on the network.","id":202,"s":"study"},{"t":6,"q":"What is required to set an IP address manually on a network?","o":["IP address and device name","Subnet mask and gateway","Subnet mask and DNS server","IP address and subnet mask"],"a":3,"e":"An IP address and subnet mask are required to set an IP address manually on a network.","id":203,"s":"study"},{"t":6,"q":"Which type of server automatically assigns an IP address to the MAC address during the device’s connection to a network?","o":["Gateway","Virtual private network","DNS","DHCP"],"a":3,"e":"A DHCP server automatically assigns an IP address to the MAC address during the device’s connection to a network.","id":204,"s":"study"},{"t":6,"q":"Which of the following switches just needs to be plugged in and connected to devices?","o":["Unmanaged","LAN","Addressing","Managed"],"a":0,"e":"Unmanaged switches just need to be plugged in and connected to devices.","id":205,"s":"study"},{"t":6,"q":"A _____ sends packets to different locations on a network and connects to outside networks.","o":["Switch","Gateway","Bridge","Router"],"a":1,"e":"A gateway sends packets to different locations on a network and connects to outside networks.","id":206,"s":"study"},{"t":6,"q":"A _____ controls incoming and outgoing network traffic and determines what will be allowed through based on a set of security rules.","o":["Switch","Gateway","Firewall","Router"],"a":2,"e":"A firewall controls incoming and outgoing network traffic and determines what will be allowed through.","id":207,"s":"study"},{"t":7,"q":"The path on which signal types travel is called _____.","o":["Signal flow","Signal transfer route","Wires and cables","Audio and video control"],"a":0,"e":"The path on which signal types travel is calledsignal flow.","id":208,"s":"study"},{"t":7,"q":"The purpose of shielding is to prevent _____ from mixing with the signal.","o":["Insulation","Jackets","Conductors","Noise"],"a":3,"e":"The purpose of shielding is to prevent noise from mixing with the signal.","id":209,"s":"study"},{"t":7,"q":"Which of the following differentiates cable from wire?","o":["Cable contains a shield.","Cable contains only one conductor.","Cable contains multiple conductors.","Conductors are insulated."],"a":2,"e":"Cable contains multiple conductors.","id":210,"s":"study"},{"t":7,"q":"Twisted-pair cable using balanced circuitry can help in _____.","o":["Keeping noise from audio and video","Blocking static","Preserving the original transmission","Rejecting interference"],"a":3,"e":"Twisted-pair cable using balanced circuitry can help in rejecting interference.","id":211,"s":"study"},{"t":7,"q":"Unless amplified or buffered, digital signals generally do not travel as far as _____ signals.","o":["Wireless","Analog","Fiber","Cable"],"a":1,"e":"Unless amplified or buffered, digital signals generally do not travel as far as analog signals.","id":212,"s":"study"},{"t":7,"q":"Switchers _____.","o":["Must have power to operate","Mix different inputs to a signal output","Connect multiple inputs simultaneously to one output","Allow the user to select one input from a number of inputs"],"a":3,"e":"Switchers allow the user to select one input from a number of inputs.","id":213,"s":"study"},{"t":7,"q":"A 4 × 2 matrix switcher _____.","o":["Can connect any of four inputs to one or both of two outputs","Must have only one output connected at any given time","Can connect either of two inputs to any or all of four outputs","Has effectively eight outputs"],"a":0,"e":"A 4 × 2 matrix switcher can connect any of four inputs to one or both of two outputs.","id":214,"s":"study"},{"t":7,"q":"An AV rack is a housing unit that _____ electronic equipment.","o":["Identifies","Elevates","Protects and organizes","Cools"],"a":2,"e":"An AV rack is a housing unit that protects and organizes electronic equipment.","id":215,"s":"study"},{"t":7,"q":"The inside of a typical AV rack is _____ wide, and the outside varies from _____.","o":["1 foot (305mm); 2 to 7 feet (610mm to 2.13m)","19 inches (482.6mm); 21 to 25 inches (533 to 635mm)","25 inches (635mm); 19 to 21 inches (482.6 to 533mm)","21 inches (533mm); 19 to 25 inches (482.6 to 635mm)"],"a":1,"e":"The inside of a typical AV rack is 19 inches (482.6mm) wide, and the outside varies from 21 to 25 inches (533 to 635mm).","id":216,"s":"study"},{"t":8,"q":"Remote control systems _____ the operation of an AV system.","o":["Complicate","Automate","Reconfigure","Simplify"],"a":3,"e":"Control systems simplify the operation of an AV system.","id":217,"s":"study"},{"t":8,"q":"Which of these isnota common method of interfacing with a control system?","o":["GUIs","Flip charts","Wireless touch panels","Wall switches"],"a":1,"e":"Flip charts are not a common method of interfacing with a control system.","id":218,"s":"study"},{"t":8,"q":"Which of the following is most likely to be a function rather than a program?","o":["Starting a videoconference","Playing a video","Dimming the lights and starting a media player","Setting volume levels"],"a":3,"e":"Setting volume levels is more likely to be a function than a program.","id":219,"s":"study"},{"t":8,"q":"Which of the following would most likely require a program?","o":["Turning on the lights","Activating a single function on a device","Powering on the audio amplifier and display","Setting a volume level"],"a":2,"e":"Powering on the audio amplifier and display would most likely be a program.","id":220,"s":"study"},{"t":8,"q":"The purpose of a control system interface is to send instructions to the _____.","o":["Internet gateway","Network printers","Hard drive","Control system CPU"],"a":3,"e":"The purpose of a control system interface is to send instructions to the control system CPU.","id":221,"s":"study"},{"t":8,"q":"Communication that allows a return message is called _____.","o":["Omnidirectional","Bidirectional","Multidirectional","Unidirectional"],"a":1,"e":"Communication that allows a return message is calledbidirectional.","id":222,"s":"study"},{"t":8,"q":"Contact-closure control communication provides device operation by _____.","o":["Increasing the power level of the electrical circuit","Reducing the wattage in a current loop","Increasing resistance in a voltage loop","Closing or opening an electrical contact"],"a":3,"e":"Contact-closure control communication provides device operation by closing or opening an electrical contact.","id":223,"s":"study"},{"t":8,"q":"Which of the following can interfere with an IR control?","o":["Quality of the device","Strength of the power source","Shadows and darkness","Bright sunshine or fluorescent lighting"],"a":3,"e":"Bright sunshine or fluorescent lighting can interfere with an IR control.","id":224,"s":"study"},{"t":8,"q":"Ethernet is mainly used in control systems _____.","o":["To control complex systems","For one-way device communication","To create IP addresses","For analog devices"],"a":0,"e":"Ethernet is mainly used in control systems to control complex systems.","id":225,"s":"study"},{"t":9,"q":"Voltage is the force that causes ____ to flow through a conductor.","o":["Ohms","Neutrons","Watts","Current"],"a":3,"e":"Voltage is the force that causes current to flow through a conductor.","id":226,"s":"study"},{"t":9,"q":"Current is measured in ____.","o":["Amperes","Volts","Ohms","Watts"],"a":0,"e":"Current is measured in amperes.","id":227,"s":"study"},{"t":9,"q":"The opposition to the flow of current in an AC circuit is called _____.","o":["Ohms","Resistance","Impedance","Dissipation"],"a":2,"e":"The opposition to the flow of current in an AC circuit is called impedance.","id":228,"s":"study"},{"t":9,"q":"Power is measured in _____.","o":["Voltage","Impedance","Resistance","Watts"],"a":3,"e":"Power is measured in watts.","id":229,"s":"study"},{"t":9,"q":"The relationship between voltage, current, and resistance is defined by the formula _____.","o":["V=I/R","I=R/V","I=V/R","R=V*I"],"a":2,"e":"The relationship between voltage, current, and resistance is defined by the formulaI=V/R.","id":230,"s":"study"},{"t":9,"q":"A current is always seeking to return to the _____.","o":["Battery","Load","Ground","Source"],"a":3,"e":"A current is always seeking to return to the source.","id":231,"s":"study"},{"t":9,"q":"The main panel distributes power using _____.","o":["Distribution panels and service entrances","Feeders and distribution panels","Branch circuits and feeders","Service entrances and distribution panels"],"a":1,"e":"The main panel distributes power using feeders and distribution panels.","id":232,"s":"study"},{"t":9,"q":"At what point in the AC power system are the branch circuits that power wall outlets and AV equipment connected?","o":["Lateral feed","Feeders","Main distribution","Subsidiary distribution panel (panelboard)"],"a":3,"e":"The branch circuits that power wall outlets and AV equipment are connected to the subsidiary distribution panel (panelboard).","id":233,"s":"study"},{"t":9,"q":"When planning an electrical system, do not plan to exceed ____ of the current capacity of any circuit.","o":["95 percent","80 percent","65 percent","75 percent"],"a":1,"e":"When planning an electrical system, do not plan to exceed 80 percent of the current capacity of any circuit.","id":234,"s":"study"},{"t":10,"q":"An AC signal of _____ falls into the RF spectrum.","o":["9kHz to 300GHz","No less than 9kHz","300GHz and below","3kHz to 300GHz"],"a":3,"e":"An AC signal of 3kHz to 300GHz falls into the RF spectrum.","id":235,"s":"study"},{"t":10,"q":"What does the transmitter do with its incoming signal stream?","o":["Modulates it to be sent out via an antenna","Stores and reads it","Demodulates it","Converts it so that it can be translated and received"],"a":0,"e":"A transmitter modulates its incoming signal stream to be sent out via antenna.","id":236,"s":"study"},{"t":10,"q":"_____ is the most important step in converting data in a transmitter.","o":["Transmission","Demodulation","Extraction","Modulation"],"a":3,"e":"Modulation is the most important step in converting data in a transmitter.","id":237,"s":"study"},{"t":10,"q":"The range of frequencies between 300MHz and 3GHz is the ___ band.","o":["VHF","HF","VLF","UHF"],"a":3,"e":"The range of frequencies between 300MHz and 3GHz is the UHF band.","id":238,"s":"study"},{"t":10,"q":"One of the most efficient configurations for a vertical antenna is to _____.","o":["Have a physical length one-quarter of the signal wavelength","Have a wavelength one-half the size of the receiving antenna","Have proper orientation","Have a mounting close to the ground"],"a":0,"e":"One of the most efficient configurations for a vertical antenna is to have a physical length one-quarter of the signal wavelength.","id":239,"s":"study"},{"t":10,"q":"The main function of a diversity receiver is to ____.","o":["Amplify echoes so that the main signal is strengthened","Find incident and reflected signals that arrive in phase","Compare phase differences between signals to avoid cancellation","Eliminate multipath signals that come from the transmitter"],"a":2,"e":"The main function of a diversity receiver is to compare the phase differences between signals to avoid cancellation.","id":240,"s":"study"},{"t":10,"q":"Parabolic antennas are ideal for use ____","o":["In tropical climates","In point-to-point communications","Where wide area coverage is important","Where the transmitters or receivers are in motion"],"a":1,"e":"Parabolic antennas are ideal for use in point-to-point communications.","id":241,"s":"study"},{"t":11,"q":"During a needs meeting, a colleague keeps steering the client back to display technologies with rapid-fire questions. Why does this undermine active listening?","o":["It slows the meeting down","It prevents actually hearing what the client is trying to communicate","It makes the client talk too much","It skips the benchmarking step"],"a":1,"e":"Active listening means focusing on the speaker, paraphrasing, and clarifying — not steering the conversation toward the topic you want. Redirecting defeats its purpose.","id":242,"s":"study"},{"t":11,"q":"A client needs to review your detailed technical AV plan. The most appropriate delivery method is:","o":["A long, thorough e-mail message","An attached electronic document","A conference call walking through the details","A series of text messages"],"a":1,"e":"Detailed technical information belongs in an electronic document the client can study; e-mail bodies, calls, and texts are too informal for detailed plans.","id":243,"s":"study"},{"t":11,"q":"What is the single most valuable input when defining what an AV system must do?","o":["Architectural drawings of the building","End users' descriptions of the tasks and applications the system will support","The building owner's equipment brand preferences","Notes from benchmarking visits"],"a":1,"e":"The needs analysis is anchored in end-user task and application descriptions — everything else supports that.","id":244,"s":"study"},{"t":11,"q":"The primary purpose of an initial needs analysis is to:","o":["Produce the equipment list for procurement","Identify end-user activities and the system functions needed to support them","Capture the client's vision for how the room should look","Set the final project budget"],"a":1,"e":"Needs analysis identifies activities and supporting functions. The equipment list comes later and is explicitly not part of the needs analysis.","id":245,"s":"study"},{"t":11,"q":"Knowing that the room will be a huddle room helps the designer primarily by:","o":["Providing a standard design template to hand the architect","Providing a starting point for determining client needs","Eliminating the need for user interviews","Fixing the equipment budget"],"a":1,"e":"Room function gives a starting point — each standard room type carries typical AV expectations — but it never replaces the needs analysis.","id":246,"s":"study"},{"t":11,"q":"In the needs-analysis workflow, task parameters (image sources, aspect ratios, viewer distance, etc.) are used to:","o":["Provide overall information about the desired general AV needs","Choose the exact display models","Lay out furniture positions","Assign installation labor"],"a":0,"e":"Task parameters feed both facility and system requirements — they describe the general AV needs in enough detail to shape design and budget.","id":247,"s":"study"},{"t":11,"q":"The core purpose of benchmarking visits is to:","o":["Audition specific equipment before purchase","Let the client experience several AV designs that address needs similar to theirs","Test the proposed system design in a live venue","Vet integrators before awarding the contract"],"a":1,"e":"Benchmarking gives the owner and design team a shared vision by experiencing comparable facilities — including what those owners would do differently.","id":248,"s":"study"},{"t":11,"q":"Why does the AV team need the fullest available set of building drawings, not just floor plans?","o":["To approve the architect's design","Because the AV design must account for other building systems — including hidden structural, mechanical, and fire systems","Because AV symbols only appear on full sets","To calculate the project markup"],"a":1,"e":"Discipline drawings define a system's function, but its physical relationship to the room lives elsewhere; hidden systems determine what can hang from ceilings and walls.","id":249,"s":"study"},{"t":11,"q":"Which contact information should be collected at the initial client meetings?","o":["Just the primary decision-maker's mobile number","The main contact plus the technical representative","Every stakeholder who may be needed — architect, building manager, IT, security, construction manager, and more","Only e-mail addresses, for the record"],"a":2,"e":"Collect the full stakeholder set — anyone you may need during site inspection, design, and installation.","id":250,"s":"study"},{"t":11,"q":"The site has strict noise limits during business hours. The AV team should:","o":["Substitute quieter equipment in the design","Ask the client to waive the restriction","Develop a work-around plan, such as scheduling noisy work in the evening","Remove the affected tasks from the scope"],"a":2,"e":"Constraints are handled with work-around plans — not dropped scope, swapped gear, or demands that the client remove them.","id":251,"s":"study"},{"t":12,"q":"On a site visit, the primary regulations governing your PPE are typically set by:","o":["Your employer's safety manual","The AHJ","The client's insurance company","The general contractor"],"a":1,"e":"The Authority Having Jurisdiction defines primary work-site regulations — though client, insurer, and employer rules may add to them.","id":252,"s":"study"},{"t":12,"q":"Two applicable codes conflict on a rigging detail. Best practice says to follow:","o":["The national code, always","Whichever code is cheaper to satisfy","The most restrictive code — and the local AHJ where interpretations clash","The code the client prefers"],"a":2,"e":"AV professionals follow the most restrictive applicable code; the local AHJ settles interpretation disputes.","id":253,"s":"study"},{"t":12,"q":"Which of these is NOT part of the standard work-site safety equipment set?","o":["Fall-protection harnesses and static lines","Approved non-conductive ladders","Tools with non-slip handles","PPE such as hard hats and safety glasses"],"a":2,"e":"The safety triad is PPE, approved non-conductive ladders, and fall protection. Non-slip handles are nice but not required safety equipment.","id":254,"s":"study"},{"t":12,"q":"Fall-protection equipment is commonly required by the AHJ when working above:","o":["4 ft (1.2 m)","6 ft (2 m)","10 ft (3 m)","15 ft (4.5 m)"],"a":1,"e":"Falls are the leading cause of work-site fatalities; harnesses and static lines are typically mandated above 6 ft / 2 m.","id":255,"s":"study"},{"t":12,"q":"You need to check ceiling space at a live construction site. Which ladder should you carry?","o":["Aluminum — lightest to transport","Fiberglass — non-conductive","Steel — most rigid","Any ladder rated for your weight"],"a":1,"e":"Never use conductive ladders on a work site — someone else's mistake could energize a surface. Fiberglass is preferred; wood is generally acceptable.","id":256,"s":"study"},{"t":12,"q":"Which drawing shows sprinkler heads, HVAC diffusers, and light fixtures you must coordinate around when placing ceiling speakers?","o":["Elevation drawing","Reflected ceiling plan","Section drawing","Detail drawing"],"a":1,"e":"The RCP depicts the ceiling as if mirrored in the floor — the coordination map for anything ceiling-mounted.","id":257,"s":"study"},{"t":12,"q":"To find out what's hidden behind a wall before running cable, consult a:","o":["Plan drawing","Elevation drawing","Section drawing","Schedule"],"a":2,"e":"Sections are vertical cutouts through the structure; elevations are just pictures of wall faces.","id":258,"s":"study"},{"t":12,"q":"A dimension on the drawing reads 1200 mm AFF. This tells you:","o":["The item is not in your contract","The height above the finished floor at which to install the item","The item is planned for a future phase","The drawing is not to scale"],"a":1,"e":"AFF = above finished floor — the standard way mounting heights are called out. (NIC = not in contract; FUT = future; NTS = not to scale.)","id":259,"s":"study"},{"t":12,"q":"On a 1:50 metric drawing, a corridor measures 20 cm. Its real-world length is:","o":["1 m","5 m","10 m","20 m"],"a":2,"e":"20 cm × 50 = 1,000 cm = 10 m. (Handy anchor: at 1:50, every 2 cm on paper is 1 m real.)","id":260,"s":"study"},{"t":12,"q":"A room is listed as 15 ft wide, 20 ft long, and 10 ft high. Its floor area is:","o":["300 ft²","3,000 ft²","350 ft²","45 ft²"],"a":0,"e":"Area = length × width = 20 × 15 = 300 ft². The ceiling height is a distractor — only volume uses all three dimensions.","id":261,"s":"study"},{"t":13,"q":"When evaluating the audience area, the AV designer's main concerns are:","o":["HVAC capacity and lighting wattage","Whether everyone can see and hear the presentation, and move comfortably","Keeping all seats within 25 ft of the screen","Furniture styling choices"],"a":1,"e":"Audience-area evaluation centers on sight, sound, and comfortable movement (with seat/aisle minimums possibly set by the AHJ).","id":262,"s":"study"},{"t":13,"q":"The key question when evaluating a proposed control/projection room is whether it:","o":["Has a window to the parking lot","Meets size, power, and HVAC requirements and provides the services the AV gear needs","Is on the same floor as the boardroom","Can be locked"],"a":1,"e":"Control areas must offer space, power, HVAC, cabling, task lighting, sound isolation, and monitoring of the main room.","id":263,"s":"study"},{"t":13,"q":"An AV designer's chief worry about the building's HVAC system is usually:","o":["Whether it keeps the audience comfortable","Whether it interferes with AV component placement or generates excessive noise","Whether its controls integrate with the touch panel","Its energy efficiency rating"],"a":1,"e":"For AV, HVAC is primarily a noise and placement-conflict problem — comfort is the mechanical engineer's job.","id":264,"s":"study"},{"t":13,"q":"The first things to assess in a room's acoustic environment are:","o":["Loudspeaker brand options","Ambient noise and reverberation","The mixer channel count","Wall paint color"],"a":1,"e":"Ambient (background) noise and reverberation/echo are the two core acoustic issues that determine intelligibility.","id":265,"s":"study"},{"t":13,"q":"A radiology group needs displays for examining medical images at full detail. Which viewing-task category (and DISCAS calculator) applies?","o":["Passive viewing","Basic decision-making","Analytical decision-making","Full-motion video"],"a":2,"e":"Pixel-level engagement — medical imaging, engineering drawings, forensics — is ADM.","id":266,"s":"study"},{"t":13,"q":"A 16:9 display is 4 ft tall. How wide is it?","o":["5.33 ft","6.0 ft","7.11 ft","8.0 ft"],"a":2,"e":"Width = height × 1.7777 → 4 × 1.7777 ≈ 7.11 ft (2.17 m). Keep four decimals to avoid rounding errors.","id":267,"s":"study"},{"t":13,"q":"A projection screen will face a lobby wall of street-level windows. The designer's primary initial concern is:","o":["Ambient light washing out the image","Traffic noise","Cable distance to the projector","Screen gain rating"],"a":0,"e":"A front screen reflects all light — projected and ambient alike — so ambient light control is the make-or-break issue.","id":268,"s":"study"},{"t":13,"q":"Which factor most affects the achievable contrast ratio of a front-projected image?","o":["Projector mounting angle","Ambient light level in the room","Throw distance","Screen aspect ratio"],"a":1,"e":"Black can't be blacker than the unlit screen, so ambient light sets the floor for system black and thus contrast.","id":269,"s":"study"},{"t":13,"q":"One foot-candle equals:","o":["1 lux","3.28 lux","10.76 lux","76 lux"],"a":2,"e":"1 fc = 1 lumen/ft² = 10.76 lux (1 lux = 1 lumen/m²).","id":270,"s":"study"},{"t":13,"q":"The simplest acceptable lighting design for a basic AV presentation room is:","o":["A single switched circuit for the whole room","Two switched zones — screen-area lights separate from the rest","A theatrical dimming console","Occupancy sensors only"],"a":1,"e":"The baseline is two zones, so lights washing the screen can be killed independently; real systems usually go far beyond.","id":271,"s":"study"},{"t":14,"q":"A sightline study is performed to determine:","o":["Required projector lumens","Whether the audience has a clear view of the screen from every seat","Loudspeaker aiming angles","The room's occupancy limit"],"a":1,"e":"It maps lowest visible screen point, near/far view angles, off-axis distortion, and ergonomics to guarantee clear views.","id":272,"s":"study"},{"t":14,"q":"Which recommendation would NOT reduce ambient light reaching the screen?","o":["Focused task lighting at work positions","Lighter-colored wall finishes","A lighting control system with dimming","Heavy drapes on the windows"],"a":1,"e":"Light finishes reflect more light toward the screen and reduce perceived contrast — surfaces near the screen should be darker and neutral.","id":273,"s":"study"},{"t":14,"q":"Sound-diffusing surfaces are often preferred over heavy absorption because diffusion:","o":["Is always cheaper","Reduces echoes while preserving a sense of space, without over-deadening the room","Eliminates the need for equalization","Blocks HVAC noise"],"a":1,"e":"Ideal diffusers (irregular/convex surfaces) scatter energy evenly — cutting echo without absorption's extremes. Over-absorbed rooms feel strange.","id":274,"s":"study"},{"t":14,"q":"In the United States, the building industry's single-number background-noise rating is called:","o":["RT60","NC — Noise Criterion","THD","SPL-A"],"a":1,"e":"NR (Noise Rating) internationally, NC (Noise Criterion) in the US; RC (Room Criteria) additionally captures tonal character like rumble and hiss.","id":275,"s":"study"},{"t":14,"q":"For sightline calculations, the average seated eye height is:","o":["1.0 m (39 in)","1.2 m (48 in)","1.3 m (52 in)","1.5 m (62 in)"],"a":1,"e":"Seated eye = 1.2 m / 48 in — 100 mm (4 in) below seated head height (1.3 m / 52 in); standing eye is 1.5 m / 62 in.","id":276,"s":"study"},{"t":14,"q":"Viewers of a projected image should generally be placed:","o":["Within a 30° arc of screen center","Within a 60° arc of the far edge of the screen","Anywhere with line of sight","Within 4 screen heights"],"a":1,"e":"The guideline is a 60° arc from the screen's far edge; LCD/LED flat panels can tolerate wider angles.","id":277,"s":"study"},{"t":14,"q":"Cable pulled through a breathable air-handling space must be:","o":["Shielded twisted pair","Plenum-rated or low-smoke zero-halogen","Direct-burial rated","Any cable inside an inner jacket"],"a":1,"e":"Burning cable smoke rides the air handlers through the building — plenum spaces demand plenum-rated or LSZH cable.","id":278,"s":"study"},{"t":14,"q":"An infrared assistive listening system imposes which design requirement?","o":["A dedicated 70 V speaker line","Line of sight between the transmitter and listeners' receivers","An induction loop in the floor","Its own VLAN"],"a":1,"e":"IR transmission needs line of sight; RF and induction-loop systems are alternatives without that constraint.","id":279,"s":"study"},{"t":14,"q":"Building codes most commonly affect an AV installation by dictating:","o":["The layout of the AV system","The type of wiring used (plus mounting requirements)","A mandatory separate technical power system","Loudspeaker brands"],"a":1,"e":"AV layout itself isn't typically code-regulated — codes bite through wiring types (plenum, conduit) and mounting/structural rules.","id":280,"s":"study"},{"t":14,"q":"Exit signs cast light near your screen wall and can't be relocated. The correct response is to:","o":["Cover them during presentations","Design the system to accommodate them","File a variance with the AHJ","Specify a brighter projector and ignore the issue"],"a":1,"e":"Life-safety elements are immovable design constraints — the AV designer accommodates them in the overall design.","id":281,"s":"study"},{"t":15,"q":"The objective of the program phase is to:","o":["Write the control-system code","Produce detailed installation drawings","Describe the AV systems needed to support the defined needs, with general costs","Deliver an enforceable quote"],"a":2,"e":"Programming defines needs → required systems → general costs; detailed design comes after the report is approved.","id":282,"s":"study"},{"t":15,"q":"Specific AV system capabilities should be based on:","o":["The identified needs of the end users","The general contractor's installation capabilities","The most recent benchmarking visit","The architect's aesthetic direction"],"a":0,"e":"Everything traces back to end-user needs — the top of the needs pyramid.","id":283,"s":"study"},{"t":15,"q":"The main objective of a concept design/program report is to:","o":["Give installers pinout details","Communicate the overall systems and budget to decision-makers","List every component part number","Replace the construction contract"],"a":1,"e":"The report tells decision-makers about systems and budget (and users, the design team, and the integrator about scope and functionality).","id":284,"s":"study"},{"t":15,"q":"Which report section identifies the end users who were interviewed?","o":["Infrastructure considerations","Systems descriptions","Executive summary","AV budgets"],"a":2,"e":"The executive summary covers the project, the programming process (who was consulted), the systems, special issues, and the budget reference.","id":285,"s":"study"},{"t":15,"q":"Before detailed design exists, the cost figure appropriate for the program report is:","o":["A quote","An opinion of probable cost","A line-item estimate","A change order"],"a":1,"e":"Opinion of probable cost = early, experience-based figure. An estimate adds line-item objectivity; a quote is detailed and enforceable.","id":286,"s":"study"},{"t":15,"q":"Once approved, the program report becomes the basis for:","o":["Immediate equipment purchasing","Developing detailed AV design documents and cost estimates","The owner's operating manual","The commissioning checklist"],"a":1,"e":"Approval converts the report into the foundation for detailed design and refined costing — protecting owner and AV team alike.","id":287,"s":"study"},{"t":15,"q":"Which standard describes the methods, tasks, and deliverables of the AV design and coordination process?","o":["AVIXA V202.01 (DISCAS)","ANSI/INFOCOMM 2M-2010","AVIXA A102.01","ANSI S12.60"],"a":1,"e":"ANSI/INFOCOMM 2M-2010, Standard Guide for Audiovisual Systems Design and Coordination Processes — especially relevant to the program phase.","id":288,"s":"study"},{"t":15,"q":"A general contractor handling the AV subcontract on a $2M system might add a markup of roughly:","o":["$2,000–$5,000","$20,000–$40,000","$100,000–$200,000","$500,000+"],"a":2,"e":"GC markups typically run 5–10% or more — $100k–$200k on a $2M system.","id":289,"s":"study"},{"t":15,"q":"A contingency budget of 5–10% is most appropriate for projects that are:","o":["Under $50k and under a month","Over $500,000 and lasting a year or more","Design-build only","Government-funded only"],"a":1,"e":"Large, long projects face site conflicts, equipment updates, and new technology — hence the 5–10% contingency over $500k / 1 yr+.","id":290,"s":"study"},{"t":15,"q":"During report review, which stakeholder typically reviews and routes the document but does NOT sign off?","o":["The owner","The end users","The architect","The AV technology manager"],"a":2,"e":"Sign-off belongs to the owner and end users; the architect reviews for scope/budget impact and often distributes the report (including to MEP engineers).","id":291,"s":"study"},{"t":16,"q":"The first consideration when designing a display system is:","o":["Display resolution","How the client will use the system","Screen mounting method","The switcher model"],"a":1,"e":"Purpose first — usage drives every downstream decision about size, resolution, placement, and sources.","id":292,"s":"study"},{"t":16,"q":"The client needs video routed to overflow rooms and a lobby display. The designer should:","o":["Leave it to the installation team","Provide a spare output in the rack and move on","Determine the monitoring, feed, and recording requirements and support them in the design","Decline — feeds are the IT department's scope"],"a":2,"e":"Monitoring, feeds, and recording are explicit design responsibilities: destinations, distances, transport, audio/control, isolation, and power all need planning.","id":293,"s":"study"},{"t":16,"q":"An analog system's overall bandwidth is limited by:","o":["The highest-bandwidth component","The lowest-bandwidth device in the chain, including interconnects","The display alone","The source alone"],"a":1,"e":"The weakest link caps the system — which is why best practice selects components at 2–3× the highest signal bandwidth (recommend 3× for growth).","id":294,"s":"study"},{"t":16,"q":"The three performance parameters every audio system must achieve are:","o":["Fidelity, headroom, and gain","Loudness, intelligibility, and stability","Coverage, phase, and delay","Bass, mids, and treble"],"a":1,"e":"Intelligibility (understood?), loudness (heard?), stability (no feedback?) — the exam's favorite audio triad.","id":295,"s":"study"},{"t":16,"q":"How should the required frequency response of an audio system be determined?","o":["Always design for 20 Hz–20 kHz","Match it to the applications the system supports","Match the loudspeaker's spec sheet","Widest response the budget allows"],"a":1,"e":"A speech-only system doesn't need full range; a studio does. Application drives response — and a response spec means nothing without its ±dB tolerance.","id":296,"s":"study"},{"t":16,"q":"A conference room targets 70 dB SPL (A-weighted) for speech. The maximum acceptable background noise is:","o":["65 dB SPL (A)","55 dB SPL (A)","45 dB SPL (A)","35 dB SPL (A)"],"a":2,"e":"The intelligibility rule: program at least 25 dB above ambient → 70 − 25 = 45 dB SPL (A) max background.","id":297,"s":"study"},{"t":16,"q":"To improve intelligibility in a videoconferencing system plagued by far-end sound returning through the mics, specify:","o":["A crossover","An acoustic echo canceler","A compressor","A step-up transformer"],"a":1,"e":"Acoustic echo is far-site sound bouncing around your room into your mics; cancellation (usually a DSP/conferencing function, rated by tail length ~40–270 ms) removes it.","id":298,"s":"study"},{"t":16,"q":"Three 4-ohm loudspeakers are wired in series. Total impedance is:","o":["1.33 ohms","4 ohms","12 ohms","24 ohms"],"a":2,"e":"Series impedance adds: 4 + 4 + 4 = 12 Ω. (Parallel with equal speakers divides: Z₁ ÷ N.)","id":299,"s":"study"},{"t":16,"q":"For paging loudspeakers scattered across a large terminal, far from the amplifier, the standard approach is:","o":["Direct-coupled low-impedance wiring with heavy-gauge cable","A constant-voltage (25/70/100 V) system using transformers with selectable taps","Powered speakers with local mains everywhere","Series wiring of all speakers"],"a":1,"e":"Constant-voltage systems put a step-up transformer at the amp and tapped step-downs at each speaker — many speakers, long runs, minimal loss. Typical taps: ¼–8 W.","id":300,"s":"study"},{"t":16,"q":"A listener moves from 6 m to 12 m from a loudspeaker. The level change is found with:","o":["dB = 20 log(6/12)","dB = 10 log(12/6)","dB = 20 log(6 × 12)","dB = 6/12 × 20"],"a":0,"e":"Inverse square law: dB = 20·log(d₁/d₂) = 20·log(0.5) ≈ −6 dB — every distance doubling costs 6 dB. (Power ratios use 10·log(P₂/P₁): +6 dB ≈ 4× power.)","id":301,"s":"study"},{"t":17,"q":"Upon arriving at a job site with newly delivered equipment, what should the installer do before installing anything?","o":["Immediately mount it to save time","Open and inspect each item, checking for damage and powering it on to verify it works","Store it and install it the next day","Log the serial numbers only"],"a":1,"e":"Open, inspect, and test each device on arrival so damaged or faulty gear is caught before it's installed.","id":302,"s":"study"},{"t":17,"q":"Poor cable terminations are best described as:","o":["A minor cosmetic issue","The single most prevalent problem in electronic systems, often causing intermittent faults","Only a concern for fiber optics","Easy to find after the system is built"],"a":1,"e":"They're the #1 cause of AV problems and hard to track down because faults are often intermittent.","id":303,"s":"study"},{"t":17,"q":"Stripping a cable improperly can cause what electrical problem?","o":["Increased voltage","Distorted insulation that alters the cable's impedance","Reduced bend radius","Higher conduit fill"],"a":1,"e":"Distorting the insulation shape during stripping changes the cable's impedance properties.","id":304,"s":"study"},{"t":17,"q":"Which connector is terminated using insulation displacement?","o":["XLR","BNC","8P8C / RJ-45","RCA"],"a":2,"e":"The 8P8C/RJ-45 modular connector is terminated with an insulation-displacement tool that cuts the insulation to contact the conductors.","id":305,"s":"study"},{"t":17,"q":"A BNC connector on coaxial video cable is typically terminated by:","o":["Soldering","Linear compression","Insulation displacement","Direct screw-down"],"a":1,"e":"BNC connectors for video/RF on coax are secured by linear compression, a permanent action.","id":306,"s":"study"},{"t":17,"q":"To confirm a completed termination will properly pass a signal, perform a:","o":["Voltage test","Continuity test","Signal sweep test","Isolation test"],"a":1,"e":"A continuity test (multimeter, or pin-to-pin tester for RJ-45) verifies the termination conducts properly.","id":307,"s":"study"},{"t":17,"q":"In a free-standing equipment rack, heavy components should be placed:","o":["Near the top for easy access","At the bottom to prevent tipping","In the middle for balance","Wherever space allows"],"a":1,"e":"Heavy gear goes at the bottom of a free-standing rack; a top-heavy rack can tip over.","id":308,"s":"study"},{"t":17,"q":"Which rack-cooling method uses fans to draw hot air out, with cool air passively pulled in at the bottom?","o":["Convection","Evacuation","Forced air","Conditioning"],"a":1,"e":"Evacuation cooling uses fans to pull hot air out; forced-air pushes cool air in, and convection is fully passive.","id":309,"s":"study"},{"t":17,"q":"What is the drawback of mounting an RF wireless-microphone receiver inside a metal rack?","o":["It overheats quickly","The metal rack shields the antenna, reducing the RF signal","It requires more rack units","It interferes with the network"],"a":1,"e":"A metal rack acts as a shield; mount antennas facing forward or away from the rack (a metal door also blocks RF/IR).","id":310,"s":"study"},{"t":17,"q":"Within a rack, 'signal separation' means:","o":["Splitting composite video into RGB","Grouping equipment and cables by function/signal type to reduce EMI crosstalk","Running duplicate cables to each device","Separating power from the building ground"],"a":1,"e":"Signal separation groups cables by signal type/level so low-level signals aren't corrupted by crosstalk.","id":311,"s":"study"},{"t":17,"q":"How often should pull boxes be placed along a conduit run?","o":["Every 10 m (33 ft)","Every 30 m (100 ft), or after 180° of bend","Every 100 m (330 ft)","Only at the ends"],"a":1,"e":"Specify a pull box every 30 m (100 ft) of conduit or after 180° of total bend; junction boxes go at the ends.","id":312,"s":"study"},{"t":17,"q":"If running three cables through one conduit, their combined cross-section may occupy up to what fill percentage?","o":["53 percent","40 percent","31 percent","23 percent"],"a":1,"e":"Conduit fill: 1 cable = 53%, 2 cables = 31%, 3 cables = 40%.","id":313,"s":"study"},{"t":17,"q":"The tightest safe bend radius for a cable is approximately:","o":["Equal to the cable diameter","Twice the cable diameter","Four times the cable diameter","Ten times the cable diameter"],"a":2,"e":"About 4× the cable diameter — critical for twisted-pair, fiber, and coax. Overbent cable that wrinkles or bulges should be discarded.","id":314,"s":"study"},{"t":17,"q":"When bundling cables for a pull, which must always be kept separate?","o":["Loudspeaker cables","Video cables","Microphone cables","Control cables"],"a":2,"e":"Microphone cables carry such low-level signals they're the most susceptible to interference — keep them separate.","id":315,"s":"study"},{"t":17,"q":"A 40 kg (88 lb) display and hardware will be flown overhead. Applying the safety factor, the mount should be rated for:","o":["80 kg (176 lb)","120 kg (264 lb)","200 kg (440 lb)","400 kg (880 lb)"],"a":2,"e":"Safety factor ×5: 40 kg × 5 = 200 kg (440 lb) rated mount.","id":316,"s":"study"},{"t":17,"q":"A mounting failure where gravity pulls the mount down the wall and shears the bolts is called:","o":["Tensile load","Shear load","Pull-out","Shock loading"],"a":1,"e":"Shear load cuts the bolts like scissors; tensile stretches the fastener, pull-out removes it from the structure, shock is a sudden added load.","id":317,"s":"study"},{"t":17,"q":"'Blocking' installed before wall finishes go on is used to:","o":["Improve room acoustics","Reinforce the wall so it can carry heavy displays","Route cabling","Provide EMI shielding"],"a":1,"e":"Blocking is extra timber between studs added before finishes so the wall can support heavy mounted equipment — it requires early coordination.","id":318,"s":"study"},{"t":17,"q":"For accessibility, interactive rack equipment should be located between:","o":["0 and 380 mm AFF","380 and 1,220 mm (15–48 in) AFF","1,220 and 1,800 mm AFF","1,800 and 2,000 mm AFF"],"a":1,"e":"Interactive features should sit 380–1,220 mm (15–48 in) above the finished floor — about 840 mm of usable space per rack.","id":319,"s":"study"},{"t":17,"q":"The RS-485 protocol used for DMX512 supports how many daisy-chained devices and what terminations?","o":["16 devices, 75-ohm","32 devices, 120-ohm","64 devices, 50-ohm","8 devices, 600-ohm"],"a":1,"e":"RS-485 supports up to 32 daisy-chained devices with 120-ohm terminations at both ends of the line.","id":320,"s":"study"},{"t":17,"q":"Why is bidirectional control communication (e.g., RS-232) preferred over unidirectional?","o":["It uses less cable","The device can confirm its status or that an action occurred","It's immune to interference","It needs no configuration"],"a":1,"e":"Two-way flow lets equipment provide confirmation/feedback of its status and actions.","id":321,"s":"study"},{"t":17,"q":"In a control system, what is 'firmware'?","o":["The unique application written for a specific installation","The control CPU's operating system","The touch-panel graphics","The network switch configuration"],"a":1,"e":"Firmware is the control CPU's OS (make-specific); the 'software' is the unique application written for that specif
