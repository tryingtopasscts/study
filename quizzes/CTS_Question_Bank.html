ern, as a cable has resistance over distance.","id":120},{"t":19,"q":"During the design process, a conflict arises between what has been communicated and what is observed in the facility drawings. How should this issue be resolved?","o":["Call the general contractor and verbally get a confirmation.","Consult other designers and make design decisions based on best practices.","Submit a RFI (request for information) to the general contractor.","Create a CO (change order) and submit to the general contractor."],"a":2,"e":"Submit an RFI — always get it in writing, even if you never get a response. Projects are complicated and people forget what they were told; written replies can also be forwarded to others on the project. Verbal answers can't.","id":121},{"t":4,"q":"Which of the following is TRUE of a decibel?","o":["It is a measure of loudness.","When calculating a decibel a 20 log function for power would be utilized.","When calculating a decibel a 10 log function for sound pressure would be utilized.","It is a logarithmic value of a ratio that represents the relative change from one value to another value."],"a":3,"e":"A decibel is a logarithmic value of a ratio representing relative change. Watch the traps: power uses 10 log, voltage/sound pressure use 20 log — the other options have them backwards.","id":122},{"t":4,"q":"When comparing loudspeakers, which specification defines the efficiency of the loudspeaker?","o":["Loudness","Frequency response","Polar plot","Sensitivity"],"a":3,"e":"Sensitivity defines the efficiency of a loudspeaker — how effectively it converts input power into sound output.","id":123},{"t":4,"q":"A school gymnasium is being converted into a multipurpose space with a stage area at one end. A cluster loudspeaker system over the front of the stage is mounted 9 m from the floor. The distance from the cluster to the D2 listener is 20 m, and to the D3 listener is 40 m. What is the decibel difference between the D3 position and the D2 position?","o":["-6dB","3dB","6dB","12dB"],"a":2,"e":"Inverse square law: dB = 20log(40/20) = 6 dB. Doubling the distance costs 6 dB, so the middle (D2) position is 6 dB louder than the farthest (D3) position.","id":124},{"t":4,"q":"What is the BEST practice for deciding between unbalanced and balanced audio cables?","o":["Use unbalanced for cables under 25 ft (7.6 m).","Use unbalanced for cables under 30 ft (9.1 m).","Use balanced for all cables over 50 ft (15.2 m).","Use balanced for all cables."],"a":3,"e":"It is always the best choice to use balanced cables to avoid interference in the signal — not just past some length threshold.","id":125},{"t":4,"q":"An average human adult can hear from 20Hz to 20kHz. How many octaves does that range encompass?","o":["6 octaves","8 octaves","10 octaves","12 octaves"],"a":2,"e":"There are ten octaves between 20 Hz and 20,000 Hz (an octave is a doubling). The center frequencies are, in Hz: 31.25, 62.5, 125, 250, 500, 1000, 2000, 4000, 8000, 16000.","id":126},{"t":15,"q":"During the stakeholder meeting to present the program report, the AV Sales Manager realizes that some stakeholders have questions beyond the scope of the report. What should the manager do?","o":["Ignore the additional questions to keep the meeting focused on the report.","Politely inform the stakeholders that their questions are outside the meeting's agenda.","Address the additional questions and assure stakeholders that their concerns will be considered.","Adjourn the meeting and schedule another session specifically for addressing additional questions."],"a":2,"e":"Questions should be addressed and discussed. If the answers sustainably change the scope or program report, the report should be amended, presented again, and finally accepted and signed off.","id":127},{"t":15,"q":"During a project planning meeting for an AV project scope development, the team is discussing the technology trends relevant to end-user needs. Which of the following actions should the team take?","o":["Focus the discussion on the latest AV equipment available in the market.","Ensure the discussion aligns with the specific needs and goals of end users.","Discuss general technology advancements unrelated to the project.","Skip the discussion on technology trends as it may confuse stakeholders."],"a":1,"e":"It is important to know if the client's technology goals are being addressed. Some end users upgrade systems in a scheduled cycle that can take years — knowing the technology direction is very helpful during the needs analysis.","id":128},{"t":15,"q":"Which of the following statements accurately describes the purpose of compiling information for an AV project scope?","o":["To prioritize tasks based on budget constraints.","To gather data for the AV project manager's reference.","To ensure the proposed system meets the needs of stakeholders.","To document the architectural layout of the building."],"a":2,"e":"The proposed solution in the program report must directly meet the needs of the end-user. Project planning meetings include the needs assessment, priorities, and discussions of possible solutions.","id":129},{"t":15,"q":"When working with a client to design an AV solution for a new conference center, the client requests a detailed budget for the equipment and installation. In what phase does this occur?","o":["Design phase","Program phase","Bidding phase","Installation phase"],"a":0,"e":"A detailed list of equipment and installation labor is known as a bill of materials, and it is generated during the design phase of an AV project. The program phase produces only a rough overall budget.","id":130},{"t":15,"q":"Near the end of the installation, the client claims that an entire portion of the project hasn't even started. You are unfamiliar with what is being brought up. Which document will be the BEST place to look regarding this discrepancy?","o":["The program report.","The system diagram.","The bill of materials.","The logic network diagram."],"a":0,"e":"The program report discusses the needs of the client and the solution that addresses them — whatever portion is missing should be written there. The project design has more detail, and any change orders created since the project started are also worth reviewing.","id":131},{"t":15,"q":"Which phase comes first in a project?","o":["Commissioning and training phase","The design phase","The program phase","The construction phase"],"a":2,"e":"The program phase comes first — its purpose is to discuss, clarify, and document the owner's needs, concerns, expectations, and constraints to guide the design team on the functionality and cost of the AV systems.","id":132},{"t":17,"q":"What is the main responsibility of the lead technician during system commissioning?","o":["Finalizing the project budget.","Ensuring compliance with building codes.","Making corrections based on checklist items.","Creating operational documentation."],"a":2,"e":"During the commissioning phase, the lead technician finalizes system settings and closes out any open issues on the checklist.","id":133},{"t":17,"q":"While conducting system commissioning, the lead technician discovers that several cables are not properly labeled, making it difficult to identify connections. What action should the lead technician take?","o":["Ignore the unlabeled cables as they are not critical to system operation.","Proceed with commissioning and address the labeling issue later.","Immediately label the cables to ensure proper identification.","Inform the client about the labeling issue and wait for further instructions."],"a":2,"e":"Any label is better than no label. It is best to label cables using the cable labeling standard; however, a handwritten label is better than none.","id":134},{"t":17,"q":"What is the minimum load safety rating for mounting audio-visual equipment?","o":["3:1","5:1","8:1","10:1"],"a":1,"e":"A 5:1 safety factor should be considered whenever mounting AV equipment. The weight of the equipment and the mount itself are added together and then multiplied by 5.","id":135},{"t":17,"q":"When checking into the jobsite, it may be necessary to pass security checks. Which of the following will MOST likely need to be provided?","o":["Business card with company name and address.","Name and phone number of a contact on site.","Government-issued picture ID","A letter from the general contractor indicating authorization to be onsite."],"a":2,"e":"Verifying identity with a government-issued picture ID will most likely be the first step. Other items may be needed as well.","id":136},{"t":17,"q":"During system commissioning, the lead technician discovers that one of the projectors is not displaying images properly. After troubleshooting, it is determined that the issue is due to a faulty cable connection. What is the next step the lead technician should take?","o":["Replace the projector with a new one.","Inform the client about the issue and its resolution.","Ignore the issue as it is minor and won't affect system functionality.","Document the problem and report it to the project manager for further action."],"a":3,"e":"Documenting the condition is the appropriate action. It gets added to the list of tasks to be completed — it could be a simple or a more complicated repair.","id":137},{"t":17,"q":"When mounting equipment, many times standard screws are replaced with security screws. What is the MAIN purpose of security screws?","o":["To slow down would-be thieves.","They are stronger screws and will secure the device to the wall.","They will lockout people from attempting to tamper with the equipment.","These screws work with an alarm system and make a siren sound when disturbed."],"a":0,"e":"Security screw bits are easily purchased, but not many people have them. Someone intent on stealing the equipment can still get the tools — security screws just slow them down.","id":138},{"t":19,"q":"When speaking with the client, the project manager notices that some work expected to be done has not been completed by the integrator. How should the Project Manager address this issue?","o":["Come to a verbal agreement with the integrator to resolve the issues.","Write down and send a list of the items to be addressed to the integrator.","Have your employees resolve the issues after the integrator is gone.","Wait until the project is complete and then address the issues with the integrator."],"a":1,"e":"Sending a written list of items to be addressed ensures clear communication and documentation of the outstanding tasks, facilitating efficient resolution.","id":139},{"t":19,"q":"During the installation of the AV system, the general contractor requires a change for safety reasons. What document is submitted for this request?","o":["Request for Change (RFC)","Change Order (CO)","Construction Change Directive (CCD)","Implementation Order (IO)"],"a":2,"e":"A Construction Change Directive (CCD) is used for time-critical work such as safety changes — it bypasses the normal RFC-to-CO approval chain.","id":140},{"t":19,"q":"During the construction of commercial buildings, many different events can occur that can affect the project, such as weather delays, logistical issues, labor shortages, and financial challenges. How should risks be managed in a commercial AV project?","o":["Identify and mitigate risks with a comprehensive plan.","Rely on past experiences to assume low project risks.","Emphasize risks only if they affect the project's aesthetics.","Focus risk management efforts on equipment faults."],"a":0,"e":"Identify and mitigate risks with a comprehensive plan, including a risk register, a risk matrix, and mitigation alternatives.","id":141},{"t":18,"q":"What is the primary objective of training end users and support staff on the operation of an AV system?","o":["Eliminate the need for a service contract.","Increase the possibility of equipment damage due to improper use.","Increase the number of service calls due to preventable issues (i.e. user errors).","Build up user confidence in the equipment and provide a positive user experience."],"a":3,"e":"Proper training builds user confidence and a positive experience. Service calls and malfunctions may still happen, but training reduces the preventable ones.","id":142},{"t":18,"q":"When coordinating AV operations, which allied trade should you consider MOST critical for effective integration?","o":["Electrical","Plumbing","Security","HVAC"],"a":0,"e":"While all listed trades are important, electrical coordination is often the most critical for AV operations to ensure power supply and signal integrity.","id":143},{"t":18,"q":"During the setup for a major event, a shortage of wireless microphones is realized due to unexpectedly high demand. The event requires 12 wireless microphones, but only 8 are available. What is the most effective way to manage this shortage?","o":["Inform the event organizers that only 8 microphones will be available and proceed without making further adjustments.","Rent additional wireless microphones from a local supplier.","Reconfigure the schedule to ensure that the 8 available microphones are shared across sessions with minimal overlap.","Substitute the remaining microphones with wired ones and explain the situation to the users."],"a":1,"e":"Renting additional wireless microphones ensures all needs are met without compromising the quality or functionality of the AV setup — a proactive approach that maintains the event's professional standards.","id":144},{"t":20,"q":"What document provides a detailed record of all repairs and service work associated with the audio-visual systems?","o":["Service manual","Repair guide","Maintenance log","As built drawings"],"a":2,"e":"The maintenance log has the service dates, the work performed, and the equipment or system that was serviced.","id":145},{"t":21,"q":"What risk does an AV project face if the contract terms are not followed or are changed?","o":["Voiding the warranty.","Improved system performance.","Reduced project costs.","Faster project timeline."],"a":0,"e":"Not following the stipulations of the warranty or changing the contract terms can void the warranty, leaving the project without coverage for repairs or replacements under the original terms.","id":146},{"t":21,"q":"A component fails in the first month after an install. What is the BEST mechanism for the client to have it replaced?","o":["Manufacturers warranty","System warranty","Service agreement","Purchase a new component"],"a":0,"e":"The manufacturer's warranty typically covers defects and failures within an initial period, providing a cost-free replacement or repair.","id":147},{"t":22,"q":"An AV professional is shopping at a store, and notices there is an audible hiss coming from the background music loudspeakers. What is a TOP reason for this hiss?","o":["Interference from the lighting fixtures.","Reception static coming from the receiver.","Improper gain structure of the sound system.","The use of balanced cabling and terminations."],"a":2,"e":"The gain entering the system is too low and the signal is boosted later in the chain, which also boosts the noise going to the loudspeakers — classic poor gain structure.","id":148},{"t":22,"q":"The AV professional's team is preparing an AV system for a large conference scheduled to start in two hours. After performing the initial setup, intermittent audio dropouts from the speakers are noticed. Which is the BEST course of action to systematically troubleshoot and resolve this issue?","o":["Replace all audio cables to rule out faulty wiring.","Perform a signal test on each audio component, starting with the mixer and working towards the speakers.","Check and ensure all audio connectors are securely plugged in and the cables are properly routed to avoid interference.","Increase the gain levels on the mixer to compensate for any signal loss."],"a":1,"e":"The mixer is a halfway point in the system — a great place to confirm the inputs are making it in. Using headphones, each input can be monitored; if they sound good, focus on the output side of the system.","id":149},{"t":22,"q":"A customer is reporting instances of 'distortion' in a recently installed and calibrated audio system. What is the FIRST thing that should be done?","o":["Replace all of the speakers in the system.","Turn the amplifiers to unity gain.","Check the gain structure of all audio signals in the system.","Recalibrate all of the acoustic echo cancellers."],"a":2,"e":"Check the gain structure of all audio signals in the system to ensure proper levels and clear audio performance.","id":150},{"t":22,"q":"A client reports that the control panel in a boardroom is unresponsive. The system was rebooted, but the issue persists. What should be verified?","o":["That the network connectivity to the panel is correct","That the IR connection to the projector has not fallen","That the lectern equipment is powered on","That the panel was not switched with another meeting room"],"a":0,"e":"Verify network connectivity to the panel so that the panel and the rest of the system can communicate correctly.","id":151},{"t":22,"q":"An instructor puts in a service ticket Monday morning. It says that everything in the training room was working on the Friday of the previous week. Now, on Monday morning, the video streaming system is down. Everything seems to be powered up. What is a major area to include in your troubleshooting?","o":["The audio amplifiers and loudspeaker chain.","All the cables in the rack, something may have been unplugged over the weekend.","The HDBaseT transport cables, transmitters, and receivers.","The private network port settings and access control list (ACL)."],"a":3,"e":"After confirming the AV gear is powered and seemingly working, bring in the network manager to see if maintenance was scheduled over the weekend. With the network settings (ports and protocols) documentation, the network manager can confirm whether anything changed on the network.","id":152},{"t":22,"q":"What is the best practice to follow in the process of troubleshooting an AV system that isn't producing any sound and suspecting multiple potential causes within the system?","o":["Change several suspected components at once to save time.","Change only one component at a time and test after each change.","Restart the entire AV system to see if the problem resolves itself.","Replace the entire AV system with new equipment."],"a":1,"e":"Changing only one component at a time and testing after each change identifies the specific cause without introducing additional variables that could complicate troubleshooting.","id":153},{"t":22,"q":"The simple presentation system, consisting of an HDMI cable and ceiling-mounted projector, has been working great for many years. Recently, the projector was upgraded to a 4K capable model. If the laptop outputs 1920x1080, everything works fine. If 4K is tried, the projector won't display it. What is the LIKELY cause of this intermittent behavior?","o":["HDCP (content protection) is enabled for all 4K outputs, this needs to be disabled.","The projector needs to have the 4K option enabled in the menu settings in the projector.","The laptop graphics card output needs to be adjusted in the display options settings.","The cable needs to be replaced with an Ultra High Speed HDMI cable."],"a":3,"e":"4K requires cables that can pass a very high bandwidth signal, and all cables have attenuation that reduces the level of the signal. Ultra High Speed HDMI cables are designed to pass 48 Gbps; usable cable lengths will vary.","id":154},{"t":22,"q":"When assisting an end user who is experiencing intermittent display system failures, which of the following would be the best customer service follow-up question?","o":["What was being used just prior to the last failure?","Is the modulated cable resolution flag set to 'On'?","Can we discuss this later when we're not so busy?","If it doesn't happen frequently, can it be ignored?"],"a":0,"e":"Asking what was being used just prior to the last failure helps identify recent actions, applications, or devices that may have contributed to the issue, enabling a more accurate diagnosis.","id":155}]}</script>
<script>
(function(){
  "use strict";
  var BANK = JSON.parse(document.getElementById('bank').textContent);
  var TOPICS = BANK.topics, ALL = BANK.q;
  var TNAME = {}; TOPICS.forEach(function(t){ TNAME[t.k] = t.n; });

  var S = {
    mode:'quiz', selected:{}, order:[], i:0, answered:{}, revealed:false,
    picked:null, running:false, flipped:false, optOrder:{}
  };
  TOPICS.forEach(function(t){ S.selected[t.k] = true; });

  var $ = function(id){ return document.getElementById(id); };
  var view = $('view');

  /* ---------- sidebar ---------- */
  function countFor(k){ var n=0; ALL.forEach(function(q){ if(q.t===k) n++; }); return n; }

  function buildTopics(){
    var box = $('topics'); box.innerHTML=''; var lastPart = null;
    TOPICS.forEach(function(t){
      var n = countFor(t.k);
      if(t.part !== lastPart){
        lastPart = t.part;
        var h = document.createElement('div');
        h.className = 'part-head'; h.textContent = t.part;
        box.appendChild(h);
      }
      var l = document.createElement('label');
      l.className = 'topic' + (n ? '' : ' void');
      l.innerHTML = '<input type="checkbox"'+(n?' checked':' disabled')+' data-k="'+t.k+'">'+
                    '<span class="tn">'+t.n+'</span>'+
                    '<span class="tc">'+(n || '--')+'</span>';
      if(!n){ S.selected[t.k] = false; l.title = 'No questions in the bank for this chapter yet'; }
      l.querySelector('input').addEventListener('change', function(e){
        S.selected[t.k] = e.target.checked; updateCount();
      });
      box.appendChild(l);
    });
    updateCount();
  }

  function pool(){ return ALL.filter(function(q){ return S.selected[q.t]; }); }

  function updateCount(){
    var n = pool().length;
    $('side-count').textContent = n + ' of ' + ALL.length + ' questions selected';
  }

  function setAll(v){
    TOPICS.forEach(function(t){ if(countFor(t.k)) S.selected[t.k]=v; });
    Array.prototype.forEach.call(document.querySelectorAll('#topics input'), function(c){
      if(!c.disabled) c.checked = v;
    });
    updateCount();
  }
  $('all').addEventListener('click', function(){ setAll(true); });
  $('none').addEventListener('click', function(){ setAll(false); });

  Array.prototype.forEach.call(document.querySelectorAll('#mode-seg button'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#mode-seg button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on'); S.mode = b.dataset.mode;
    });
  });

  function openNav(v){ document.body.classList.toggle('nav-open', v); }
  $('burger').addEventListener('click', function(){ openNav(!document.body.classList.contains('nav-open')); });
  $('scrim').addEventListener('click', function(){ openNav(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') openNav(false); });

  /* ---------- session ---------- */
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function start(list){
    var qs = list || pool();
    if(!qs.length){ view.innerHTML = '<div class="card empty">No questions selected. Open the menu and pick at least one chapter.</div>'; return; }
    S.order = qs.slice();
    if($('shuffleQ').checked) shuffle(S.order);
    S.optOrder = {};
    S.order.forEach(function(q){
      var idx = q.o.map(function(_,n){ return n; });
      if($('shuffleA').checked) shuffle(idx);
      S.optOrder[q.id] = idx;
    });
    S.i = 0; S.answered = {}; S.revealed = false; S.picked = null; S.flipped = false; S.running = true;
    openNav(false); render();
  }
  $('start').addEventListener('click', function(){ start(null); });
  $('end').addEventListener('click', function(){ if(S.running) results(); });

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---------- render ---------- */
  function render(){
    if(!S.running){ intro(); return; }
    if(S.i >= S.order.length){ results(); return; }
    var q = S.order[S.i];
    var done = Object.keys(S.answered).length;
    var right = 0; for(var k in S.answered){ if(S.answered[k]) right++; }
    var pct = Math.round((S.i / S.order.length) * 100);
    var acc = done ? Math.round(right/done*100) + '%' : '--';

    var h = '<div id="bar-wrap">'+
      '<div id="bar-meta"><span>Question <b>'+(S.i+1)+'</b> / '+S.order.length+'</span>'+
      '<span>'+(S.mode==='quiz' ? 'Accuracy <b>'+acc+'</b><span class="detail"> &nbsp;·&nbsp; '+right+' of '+done+' correct</span>' : 'Flashcard mode')+'</span></div>'+
      '<div id="bar"><i style="width:'+pct+'%"></i></div></div>';

    h += '<div class="card"><span class="chip">'+esc(TNAME[q.t])+'</span>'+
         '<p class="qtext">'+esc(q.q)+'</p>';

    if(S.mode === 'card'){
      if(!S.flipped){
        h += '<div class="flip" id="flip">Tap to reveal the answer</div>';
      } else {
        h += '<div class="opts">';
        q.o.forEach(function(o,n){
          h += '<div class="opt locked '+(n===q.a?'right':'dim')+'"><span class="k">'+String.fromCharCode(65+n)+'</span><span>'+esc(o)+'</span></div>';
        });
        h += '</div>';
        h += '<div class="fb tip"><div class="hd">Why</div>'+esc(q.e)+'</div>';
      }
      h += '<div class="nav">';
      if(S.i>0) h += '<button class="btn ghost" id="prev">Back</button>';
      h += '<button class="btn" id="next">'+(S.i===S.order.length-1?'Finish':'Next')+'</button></div>';
    } else {
      var order = S.optOrder[q.id];
      h += '<div class="opts">';
      order.forEach(function(orig, pos){
        var cls = 'opt';
        if(S.revealed){
          cls += ' locked';
          if(orig === q.a) cls += ' right';
          else if(orig === S.picked) cls += ' wrong';
          else cls += ' dim';
        }
        h += '<button class="'+cls+'" data-o="'+orig+'"'+(S.revealed?' disabled':'')+
             '><span class="k">'+String.fromCharCode(65+pos)+'</span><span>'+esc(q.o[orig])+'</span></button>';
      });
      h += '</div>';

      if(S.revealed){
        var ok = S.picked === q.a;
        h += '<div class="fb '+(ok?'ok':'no')+'"><div class="hd">'+(ok?'Correct':'Not quite')+'</div>';
        if(!ok) h += '<div class="ans">Correct answer: <b>'+esc(q.o[q.a])+'</b></div>';
        h += esc(q.e)+'</div>';
        h += '<div class="nav"><button class="btn" id="next">'+(S.i===S.order.length-1?'See results':'Next question')+'</button></div>';
      } else if(S.picked !== null){
        h += '<div class="nav"><button class="btn" id="reveal">Check answer</button></div>';
      }
    }
    h += '</div>';
    view.innerHTML = h;
    wire(q);
    window.scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'auto' : 'auto'});
  }

  function wire(q){
    var f = $('flip');
    if(f) f.addEventListener('click', function(){ S.flipped = true; render(); });

    Array.prototype.forEach.call(document.querySelectorAll('.opt[data-o]'), function(b){
      b.addEventListener('click', function(){
        if(S.revealed) return;
        S.picked = parseInt(b.dataset.o, 10);
        if($('instant').checked) reveal(q); else render();
      });
    });

    var r = $('reveal'); if(r) r.addEventListener('click', function(){ reveal(q); });
    var n = $('next'); if(n) n.addEventListener('click', advance);
    var p = $('prev'); if(p) p.addEventListener('click', function(){ S.i--; S.flipped=false; render(); });
  }

  function reveal(q){
    S.revealed = true;
    S.answered[q.id] = (S.picked === q.a);
    render();
  }

  function advance(){
    S.i++; S.revealed = false; S.picked = null; S.flipped = false;
    render();
  }

  document.addEventListener('keydown', function(e){
    if(!S.running) return;
    if(e.target && /input|textarea/i.test(e.target.tagName)) return;
    var q = S.order[S.i]; if(!q) return;
    if(S.mode === 'quiz' && !S.revealed && /^[1-9]$/.test(e.key)){
      var pos = parseInt(e.key,10) - 1;
      var order = S.optOrder[q.id];
      if(pos < order.length){ S.picked = order[pos]; if($('instant').checked) reveal(q); else render(); }
    } else if(e.key === 'Enter' || e.key === ' '){
      if(S.mode === 'card' && !S.flipped){ e.preventDefault(); S.flipped = true; render(); }
      else if(S.revealed || S.mode === 'card'){ e.preventDefault(); advance(); }
      else if(S.picked !== null){ e.preventDefault(); reveal(q); }
    }
  });

  /* ---------- results ---------- */
  function results(){
    S.running = false;
    openNav(false);
    var seen = S.order.filter(function(q){ return q.id in S.answered; });
    if(!seen.length){ intro('No questions were answered in that session.'); return; }
    var right = seen.filter(function(q){ return S.answered[q.id]; }).length;
    var pct = Math.round(right / seen.length * 100);

    var by = {};
    seen.forEach(function(q){
      if(!by[q.t]) by[q.t] = {r:0, n:0};
      by[q.t].n++; if(S.answered[q.id]) by[q.t].r++;
    });

    var h = '<div class="card"><div class="score-hero"><div class="big">'+pct+'%</div>'+
            '<div class="sub">'+right+' of '+seen.length+' correct</div></div>';

    h += '<div class="side-label" style="margin-bottom:14px">Accuracy by chapter</div><div class="brk">';
    var lp = null;
    TOPICS.forEach(function(t){
      var d = by[t.k]; if(!d) return;
      if(t.part !== lp){ lp = t.part; h += '<div class="part-head brk-part">'+esc(t.part)+'</div>'; }
      var p = Math.round(d.r/d.n*100);
      var col = p >= 80 ? 'var(--teal)' : (p >= 60 ? 'var(--amber)' : 'var(--red)');
      h += '<div class="brk-row"><div class="brk-top"><span>'+esc(t.n)+'</span>'+
           '<span class="pc">'+d.r+'/'+d.n+' &nbsp;'+p+'%</span></div>'+
           '<div class="brk-bar"><i style="width:'+p+'%;background:'+col+'"></i></div></div>';
    });
    h += '</div>';

    var missed = seen.filter(function(q){ return !S.answered[q.id]; });
    if(missed.length){
      h += '<div class="miss"><div class="side-label" style="margin-bottom:12px">Missed ('+missed.length+')</div>';
      missed.forEach(function(q){
        h += '<div class="miss-item"><div class="mt">'+esc(TNAME[q.t])+'</div>'+
             '<div class="mq">'+esc(q.q)+'</div>'+
             '<div class="ma">'+esc(q.o[q.a])+'</div></div>';
      });
      h += '</div>';
    }

    h += '<div class="nav">';
    if(missed.length) h += '<button class="btn" id="retry">Retry the '+missed.length+' missed</button>';
    h += '<button class="btn ghost" id="again">New session</button></div></div>';

    view.innerHTML = h;
    var rt = $('retry'); if(rt) rt.addEventListener('click', function(){ start(missed); });
    $('again').addEventListener('click', function(){ start(null); });
    window.scrollTo(0,0);
  }

  /* ---------- intro ---------- */
  function intro(msg){
    var h = '<div class="hero"><div class="eyebrow">CTS Practice Exam</div>'+
      '<h1>Question bank</h1>'+
      '<p>'+ALL.length+' practice questions sorted by exam-guide chapter. '+
      'Pick your chapters in the menu, choose quiz or flashcard mode, and start.</p></div>';
    if(msg) h += '<div class="card" style="margin-bottom:18px"><div class="fb tip" style="margin:0"><div class="hd">Note</div>'+esc(msg)+'</div></div>';
    h += '<div class="card"><div class="side-label" style="margin-bottom:14px">Questions by chapter</div><div class="brk">';
    var mx = 1; TOPICS.forEach(function(t){ mx = Math.max(mx, countFor(t.k)); });
    var lp = null, empties = [];
    TOPICS.forEach(function(t){
      var n = countFor(t.k);
      if(!n){ empties.push(t.short); return; }
      if(t.part !== lp){ lp = t.part; h += '<div class="part-head brk-part">'+esc(t.part)+'</div>'; }
      var p = Math.round(n/mx*100);
      h += '<div class="brk-row"><div class="brk-top"><span>'+esc(t.n)+'</span><span class="pc">'+n+'</span></div>'+
           '<div class="brk-bar"><i style="width:'+p+'%;background:var(--teal)"></i></div></div>';
    });
    if(empties.length){
      h += '<div class="fb tip" style="margin-top:18px"><div class="hd">Gaps in this bank</div>'+
           'No questions yet for '+esc(empties.join(', '))+'. Those chapters still need study time — the bank just hasn\'t covered them.</div>';
    }
    h += '</div><div class="nav"><button class="btn" id="go">Start session</button>'+
         '<button class="btn ghost" id="opts">Choose chapters</button></div></div>';
    view.innerHTML = h;
    $('go').addEventListener('click', function(){ start(null); });
    $('opts').addEventListener('click', function(){ openNav(true); });
  }

  buildTopics();
  intro();
})();
</script>
</body>
</html>
