ic installation.","id":322,"s":"study"},{"t":17,"q":"Which IP-addressing approach is the preferred hybrid when a DHCP server exists?","o":["Manual static addressing of every device","Reserve DHCP","Pure DHCP for all devices","APIPA"],"a":1,"e":"Reserve DHCP sets aside a static block (by MAC) for must-not-change devices and assigns the rest dynamically — better than hand-addressing every device.","id":323,"s":"study"},{"t":17,"q":"A VLAN differs from a subnet in that a device:","o":["Can belong to only one VLAN but many subnets","Can belong to only one subnet but multiple VLANs","Cannot belong to either","Must belong to all VLANs"],"a":1,"e":"A device belongs to one subnet but can be on multiple VLANs; VLANs are independent of physical topology.","id":324,"s":"study"},{"t":17,"q":"A projector with a 2.0 zoom lens fills a 4 m (13 ft) wide screen. What is the throw distance?","o":["2 m (6.5 ft)","4 m (13 ft)","6 m (20 ft)","8 m (26 ft)"],"a":3,"e":"Throw distance = screen width × lens zoom ratio = 4 m × 2.0 = 8 m.","id":325,"s":"study"},{"t":17,"q":"When powering up a temporary sound-reinforcement system, the power amplifier should be:","o":["Powered on first, before other gear","Powered on last, with its inputs zeroed then brought up slowly","Left off entirely","Powered on simultaneously with the mixer"],"a":1,"e":"Power on all gear except the amp, set levels, zero the amp inputs, then power the amp and raise levels slowly.","id":326,"s":"study"},{"t":17,"q":"When mounting a flat-panel display to its bracket, you should:","o":["Use any bolts that fit the holes","Use only the premeasured bolts specified for that make and model","Use the longest bolts available for strength","Substitute wood screws if needed"],"a":1,"e":"Wrong-length or wrong-thread bolts can damage or destroy the panel — use only the specified premeasured mounting bolts.","id":327,"s":"study"},{"t":18,"q":"AVIXA uses the term 'systems performance verification' instead of 'commissioning' because:","o":["The two are unrelated processes","In construction, commissioning is a lifelong building process; AV testing is one step of it","Commissioning is a trademarked term","Verification is faster"],"a":1,"e":"Construction defines commissioning as an ongoing lifetime process, so AVIXA narrowed its term to the AV testing step (other trades still say commissioning).","id":328,"s":"study"},{"t":18,"q":"Which standard provides the framework for AV systems performance verification?","o":["ANSI/InfoComm 10:2013","ANSI/INFOCOMM 2M-2010","AVIXA V202.01 (DISCAS)","ISO 9001"],"a":0,"e":"ANSI/InfoComm 10:2013, 'Audiovisual Systems Performance Verification,' includes a reference list of ~150 verification items.","id":329,"s":"study"},{"t":18,"q":"What is the primary reason a formal performance-verification process is run before client handover?","o":["To bill the client","To identify and correct problems and objectively demonstrate the system meets spec","To register component ownership","To launch the system socially with users"],"a":1,"e":"Verification systematically tests the system, proves it meets the contracted specs, and catches problems before handover.","id":330,"s":"study"},{"t":18,"q":"An AV technician uses an understanding of signal flow mainly to:","o":["Set the contract price","Identify the source of problems when troubleshooting","Document components for billing","Choose loudspeaker brands"],"a":1,"e":"Knowing how signals move through the system lets the technician trace and locate problems.","id":331,"s":"study"},{"t":18,"q":"When briefing end users on system operation, the AV team should focus on:","o":["A detailed description of every component","Basic operations — start/stop, source selection, mic and volume control","Providing all manufacturer manuals","A schematic of the signal path"],"a":1,"e":"User briefings cover the basics: powering on/off, displaying sources, selecting mics, and adjusting volume.","id":332,"s":"study"},{"t":18,"q":"For an audio system without control-managed shutdown, the correct power-down order starts with:","o":["Turning everything off at once","Shutting down the power amplifier(s) first","Shutting down sources first","Any order is fine"],"a":1,"e":"Shut down amplifiers first to prevent transient noise peaks from damaging the loudspeakers.","id":333,"s":"study"},{"t":18,"q":"Which is NOT an objective of end-user training?","o":["Increase user confidence","Reduce service calls from user error","Reduce damage from improper use","Eliminate the need for AV company maintenance and repair"],"a":3,"e":"Training doesn't eliminate professional maintenance/repair — that's a distractor. It builds confidence and cuts user-error calls and damage.","id":334,"s":"study"},{"t":18,"q":"The recommended group size for effective hands-on end-user training is:","o":["Up to 3 people","Up to 6 people","10 to 15 people","As many as possible"],"a":1,"e":"Small groups of up to six give every participant hands-on time with the system.","id":335,"s":"study"},{"t":18,"q":"When should end-user training typically be scheduled?","o":["Before installation begins","During cable pulling","After the system is complete and fully operational","Only after the warranty expires"],"a":2,"e":"Train after the system is complete and operational — it's impractical to train on an incomplete system.","id":336,"s":"study"},{"t":18,"q":"A quick-reference operation guide for typical users is best delivered as:","o":["A bound 50-page manual","A single laminated A4/letter sheet with diagrams and simple bulleted steps","An email attachment only","A verbal briefing with no written material"],"a":1,"e":"Presenters glance at instructions moments before use, so a single laminated sheet with large text, diagrams, and bullets works best.","id":337,"s":"study"},{"t":18,"q":"Which item belongs in the final AV documentation package?","o":["Only the invoice","As-built drawings, settings schedules, config files, manuals, and a warranty statement","Just the manufacturer manuals","Only the control-system code"],"a":1,"e":"The handover package spans as-builts, settings/adjustment schedules, configuration files, manuals, spares/keys, and warranty info.","id":338,"s":"study"},{"t":18,"q":"A maintenance log should record which of the following?","o":["Only equipment failures","Date, who performed the work, problems found, corrective measures, and recommended follow-up","Only preventive maintenance dates","Only warranty claims"],"a":1,"e":"A detailed log (date, technician, problems, fixes, follow-up) lets any technician quickly understand the system's history.","id":339,"s":"study"},{"t":18,"q":"'Striking' an event refers to:","o":["Setting up the temporary system","Removing the temporary system after use","Testing the audio system","Negotiating the event contract"],"a":1,"e":"Striking (bumping out) is removing the temporary system after the event; setup is bumping in.","id":340,"s":"study"},{"t":18,"q":"When checking a networked AV system's capacity, technicians should determine the network's ___ before bandwidth testing.","o":["IP address range","peak load","DNS server","VLAN count"],"a":1,"e":"Determine the network's peak load before bandwidth testing to verify there's enough bandwidth for control, audio, video, and data.","id":341,"s":"study"},{"t":18,"q":"A good practice when striking an event is to:","o":["Begin packing before attendees leave to save time","Match each piece of gear to its labeled/bar-coded road case","Leave borrowed venue items in the loading area","Remove tape only if time permits"],"a":1,"e":"Strike after attendees leave, match gear to its labeled case, return borrowed items to a responsible person, and leave the space as found.","id":342,"s":"study"},{"t":19,"q":"The five key elements of a project, all driven by the client's purpose, are:","o":["Design, build, test, deploy, support","Scope, time, cost, quality, risk","People, process, product, price, place","Plan, do, check, act, review"],"a":1,"e":"Scope, Time, Cost, Quality, and Risk are the five project elements.","id":343,"s":"study"},{"t":19,"q":"A work breakdown structure (WBS) defines deliverables and is expressed as:","o":["Verbs","Nouns","Dates","Costs"],"a":1,"e":"A WBS defines products/services as nouns and relates the elements of work; it doesn't address who, when, or how much.","id":344,"s":"study"},{"t":19,"q":"The functions of a logic network diagram are expressed as:","o":["Nouns","Verbs such as build, test, fabricate","Milestones only","Dollar amounts"],"a":1,"e":"Logic network functions are verbs; the diagram sequences activities and shows dependencies, predecessors, and successors.","id":345,"s":"study"},{"t":19,"q":"On a logic network diagram, milestones are typically shown as:","o":["Circles","Rectangles","Diamonds or triangles","Arrows"],"a":2,"e":"Milestones (materials delivered, racks programmed) appear as diamonds or triangles.","id":346,"s":"study"},{"t":19,"q":"'Duration' for a task differs from 'effort' in that duration also reflects:","o":["Only the hands-on work time","Resource availability, number of resources, and calendars","The contract price","The number of milestones"],"a":1,"e":"Effort is total work time; duration adds resource availability, number of resources, and calendars (weekends/holidays).","id":347,"s":"study"},{"t":19,"q":"The project budget refers to:","o":["The total the client paid the AV company","The labor and materials the PM has allocated to complete the agreed work","The final amount actually spent","The cost of materials only"],"a":1,"e":"The budget is what the PM allocates (labor, supplies, equipment) to complete the work — not the price paid or the final spend.","id":348,"s":"study"},{"t":19,"q":"'Price should never equal cost' because price also includes:","o":["Only sales tax","A markup covering overhead and profit","The client's budget","The warranty reserve"],"a":1,"e":"Price = cost (labor, supplies, equipment) plus a markup for overhead (taxes, rent, insurance, benefits) and profit.","id":349,"s":"study"},{"t":19,"q":"A dependency in a project schedule is:","o":["A task that must finish by a specific date","A task that cannot begin until another task is complete","An optional task","A task requiring special conditions"],"a":1,"e":"A dependency is a task that can't start until a prior task finishes — e.g., mounting fragile AV gear only after walls are painted.","id":350,"s":"study"},{"t":19,"q":"What is the most common format for presenting a project schedule?","o":["A logic network diagram","A Gantt chart","A WBS","A pie chart"],"a":1,"e":"A Gantt chart shows tasks/subtasks as horizontal bars on a timeline, with sequence, milestones, and dependencies.","id":351,"s":"study"},{"t":19,"q":"What makes AV installation unique compared with most other construction trades?","o":["It requires no coordination","The bulk of the electronics must be installed last, after other trades finish and the site is clean","It is always finished first","It uses no scheduled milestones"],"a":1,"e":"AV electronics are sensitive to dust, moisture, and temperature, so they're installed after other trades are done and the site is clean.","id":352,"s":"study"},{"t":19,"q":"When should the AV team coordinate with other trades to best avoid conflicts?","o":["After installation is complete","Only during the warranty period","Before work starts and continuously through weekly meetings","Never — the GC handles all coordination alone"],"a":2,"e":"Conflicts caught before work starts are easiest to resolve, so active communication via kickoff and weekly status meetings is critical.","id":353,"s":"study"},{"t":19,"q":"An approved request for change (RFC) becomes a:","o":["Progress report","Letter of transmittal","Change order (CO)","Construction change directive"],"a":2,"e":"An approved RFC becomes a change order, which documents the agreed change to scope and pricing.","id":354,"s":"study"},{"t":19,"q":"If a building-design modification impacts the AV installation, the AV vendor submits a:","o":["Modification announcement (MA)","Construction change directive (CCD)","Request for change (RFC)","Progress report (PR)"],"a":2,"e":"An RFC is the document the vendor submits when a change to the AV installation contract is required.","id":355,"s":"study"},{"t":19,"q":"A construction change directive (CCD), or field order, is used to:","o":["Formally ask a project question","Trigger immediate work for time-critical field conditions, bypassing the RFI–RFC–CO process","Transmit drawings","Report weekly progress"],"a":1,"e":"A CCD is issued by the owner or GC for time-critical field conditions to start work immediately, bypassing the formal change process.","id":356,"s":"study"},{"t":19,"q":"A client requests a change that increases project cost. The AV company should:","o":["Perform the work to keep the client happy","Refuse — never deviate from the original contract","Document it in a change order signed by both parties","Cut another feature to hold cost flat"],"a":2,"e":"Document the change and its cost in a CO signed by both the client and company, confirming agreement to the contract change.","id":357,"s":"study"},{"t":20,"q":"The healthiest way to characterize an AV company's relationship with its suppliers and vendors is:","o":["Whichever vendor has the lowest price this quarter wins","A long-term partnership that helps serve clients and sustain the business","A single exclusive supplier for all goods","Whatever vendors the client specifies"],"a":1,"e":"Vendors and suppliers should become long-term partners in meeting client needs — built through face-to-face contact, documented transactions, and professional problem-solving.","id":358,"s":"study"},{"t":20,"q":"When a special-order spare part needs to be expedited, the manager should:","o":["Send repeated e-mails to the general inbox","Communicate with the correct person — possibly a higher-level manager at the supplier","Switch suppliers immediately","Ask the client to intervene"],"a":1,"e":"Match each issue to the right contact; escalating to a higher-level manager can prompt action on urgent needs.","id":359,"s":"study"},{"t":20,"q":"Managing stock for an AV integrator primarily means:","o":["Keeping total stock value under a fixed cap","Tracking what's on hand, checking supplies in/out, and reordering at low points","Reserving warehouse floor space","Only counting inventory annually"],"a":1,"e":"Track warehouse inventory, check items in and out as used, reorder when stock runs low, and work with suppliers on replacements.","id":360,"s":"study"},{"t":20,"q":"What makes rental & staging inventory harder to manage than typical warehouse stock?","o":["It's more expensive","It ships AND returns, so you track current location plus the next destination","It requires refrigeration","It can't be bar-coded"],"a":1,"e":"Rental gear comes back, so you must know where each item is now and where it's needed next — and check future events against supply.","id":361,"s":"study"},{"t":20,"q":"Why attach a unique bar code or RFID tag to each equipment case?","o":["To display the rental price","So an inventory system can check the item in and out of warehouse and venue","To identify the equipment brand","To mark which room it belongs in"],"a":1,"e":"The identifier links the item to a database and is logged in/out, giving real-time location control.","id":362,"s":"study"},{"t":20,"q":"A best practice when tagging ten identical LCD screens is to:","o":["Tag only the cases","Give each screen a unique ID and mark both the device and its case with the same number","Use one shared tag for all ten","Tag only the most expensive one"],"a":1,"e":"Serial number plus a unique ID stenciled on device AND case makes identical items identifiable and accurately shipped/repacked.","id":363,"s":"study"},{"t":20,"q":"Scan sheets are best used for:","o":["Heavy rack equipment","Items easily verified visually but slow to handle — cables, accessories, kits","Projectors only","Fragile displays"],"a":1,"e":"A list of items with their codes saves handling time for cables, accessories, and miscellaneous kits.","id":364,"s":"study"},{"t":20,"q":"Once equipment leaves the warehouse, responsibility for its security lies with:","o":["The client, always","The AV company, always","Whoever has taken control of the equipment","The venue's insurance"],"a":2,"e":"Responsibility follows control — whoever currently controls the gear is responsible for securing it.","id":365,"s":"study"},{"t":20,"q":"Etching company identification into equipment primarily serves to:","o":["Increase resale value","Deter theft by making stolen gear hard to resell","Satisfy insurance requirements","Speed up inventory scans"],"a":1,"e":"Markings make resale difficult and can prompt buyers to alert the company or police — though they can lower resale value of used gear you sell.","id":366,"s":"study"},{"t":20,"q":"The key security concern when renting equipment out is:","o":["Whether the renter can operate it","Properly identifying the person taking possession of it","Whether the renter hires guards","How the renter transports it"],"a":1,"e":"Verify the person is a legitimate customer: ID copies, a pickup photo (with prior agreement), card/billing checks, venue confirmation, references.","id":367,"s":"study"},{"t":20,"q":"Remote-monitoring services for client AV systems are designed to:","o":["Replace the control system","Track usage, flag component failures, and detect tampering — with automatic alerts","Provide CCTV security coverage","Reduce network bandwidth"],"a":1,"e":"They verify operation without site visits — tracking lamp hours, alarming on removal/modification, and alerting via SMS, e-mail, or in-room signals.","id":368,"s":"study"},{"t":20,"q":"The recommended approach to keeping AV staff professionally current is:","o":["Annual trade-show attendance only","Certification renewal only","A range of sources: certifications, courses, publications, vendor presentations, and trade shows","College coursework only"],"a":2,"e":"Breadth wins: use multiple channels rather than any single source of industry knowledge.","id":369,"s":"study"},{"t":21,"q":"Which agreement covers ONLY the equipment itself, repaired by an authorized service center?","o":["System warranty","Manufacturer's warranty","Service agreement","Field warranty"],"a":1,"e":"Manufacturer's warranties cover the equipment via authorized centers; parts and labor may run for different periods.","id":370,"s":"study"},{"t":21,"q":"What is typically NOT covered by a manufacturer's warranty?","o":["Replacement parts","Repair labor at the service center","Removal/reinstallation of installed gear and shipping to the service center","Firmware defects"],"a":2,"e":"Getting installed equipment out, back in, and shipped is typically the owner's cost unless an integrator's service agreement extends coverage.","id":371,"s":"study"},{"t":21,"q":"A system warranty covering installation materials and workmanship typically runs:","o":["30 days","6 to 12 months","3 years","The life of the system"],"a":1,"e":"Best practice (usually contract-required) is 6–12 months after installation, defined in the original scope/spec/quote.","id":372,"s":"study"},{"t":21,"q":"A brand-new device fails three weeks after installation. The repair falls under the:","o":["System warranty","Service agreement","Manufacturer's warranty","Client's insurance"],"a":2,"e":"Early failures of new equipment are the manufacturer's responsibility under its warranty.","id":373,"s":"study"},{"t":21,"q":"Ongoing preventive maintenance after the system warranty expires is provided under a:","o":["Manufacturer's warranty","System warranty","Service agreement","Purchase order"],"a":2,"e":"Service agreements cover scheduled PM visits, response-time commitments, help-desk support, and possibly extended warranties.","id":374,"s":"study"},{"t":21,"q":"A mission-critical client site would most likely contract for what response terms?","o":["Best-effort response","24/7 response","Next-week scheduling","Annual visits only"],"a":1,"e":"Typical tiers: 1-hour phone response in business hours, same-day emergency, next-business-day routine — and 24/7 for mission-critical sites.","id":375,"s":"study"},{"t":21,"q":"The owner modifies system settings without written permission from the AV provider. This may:","o":["Improve the warranty terms","Void the existing warranty or service contract","Transfer the warranty to the owner","Have no contractual effect"],"a":1,"e":"Owner/end-user modifications without written permission can void the warranty or service contract.","id":376,"s":"study"},{"t":21,"q":"Software and firmware updates should be installed:","o":["The moment they're released","Only when they improve performance, security, reliability, or add required functionality","Never on client systems","Only during emergencies"],"a":1,"e":"Updates can trigger chains of unexpected effects in associated equipment — install only when they genuinely improve the system.","id":377,"s":"study"},{"t":21,"q":"A client calls: 'the boardroom display is dead.' The technician's FIRST move is to:","o":["Drive to the site immediately","Ask detailed questions about the symptoms before traveling","Order a replacement display","Contact the manufacturer"],"a":1,"e":"Gather as much symptom information as possible first — it enables pre-trip troubleshooting and proper preparation.","id":378,"s":"study"},{"t":21,"q":"Which is an example of preventive maintenance?","o":["Replacing static-plagued cabling","Upgrading a display's resolution","Replacing a projector lamp before its rated hours expire","Reprogramming the control system"],"a":2,"e":"PM addresses limited-life components before failure — scheduled lamp and filter replacement is the classic case.","id":379,"s":"study"},{"t":21,"q":"During a PM visit, users report feedback at lower levels than before. A likely cause the technician should check:","o":["A failed amplifier","User-misadjusted equalizer settings","Wrong projector lamp","A network outage"],"a":1,"e":"Users misadjusting equipment (like EQ settings) can degrade performance — recalibration is a core PM task.","id":380,"s":"study"},{"t":21,"q":"Why should system downtime be recorded in every service record?","o":["For tax purposes","Minimal downtime demonstrates the service call was well planned and executed","To penalize the technician","It's required by manufacturers"],"a":1,"e":"Downtime records show planning quality — and complete records let any technician grasp the system's history quickly.","id":381,"s":"study"},{"t":22,"q":"The first step in troubleshooting an AV system failure is to:","o":["Determine possible failure points","Clearly identify the failure symptoms","Review the signal-flow diagram","List operational components"],"a":1,"e":"Identify and understand the symptoms first; everything else follows from knowing exactly how the system is misbehaving.","id":382,"s":"study"},{"t":22,"q":"An intermittent problem is difficult to troubleshoot because:","o":["It affects multiple components","It can't be reliably reproduced","It always involves the network","It only occurs at night"],"a":1,"e":"You either observe until it recurs or have the client call the moment it happens — and ask careful bracketing questions.","id":383,"s":"study"},{"t":22,"q":"Why should user error be considered during troubleshooting?","o":["It shouldn't — users aren't part of the system","Users may have changed settings or misoperated the system, causing the apparent failure","User error is legally significant","Users always cause failures"],"a":1,"e":"Apparent 'failures' are sometimes misoperation or changed settings — distinguish abnormal performance from user error.","id":384,"s":"study"},{"t":22,"q":"Usually the most efficient way to localize a fault in a complex system is to:","o":["Test each component in signal order","Test backward from the output","Divide the system in half, find the failing half, and repeat","Replace components until it works"],"a":2,"e":"Divide and conquer isolates the fault in a handful of halvings — minimal guessing, maximal information per test.","id":385,"s":"study"},{"t":22,"q":"The signal-flow troubleshooting strategy involves:","o":["Following the signal path from one end until the fault appears","Testing only the sources","Testing only the destinations","Randomly checking mid-path devices"],"a":0,"e":"Follow the path — source to destination or destination to source — until you find the failing cable, device, connection, or termination.","id":386,"s":"study"},{"t":22,"q":"Swapping a suspect microphone with a known-good one that also produces no sound tells you:","o":["The mixer has failed","The original microphone is probably not the cause — but most of the system is still unverified","The loudspeaker has failed","The cable is definitely bad"],"a":1,"e":"Swapping rules out only the swapped part; the rest of the chain remains unknown until further division.","id":387,"s":"study"},{"t":22,"q":"A cardinal rule while troubleshooting is to:","o":["Change several settings at once to save time","Change one thing at a time and test after each change","Skip documentation until the fix works","Start by replacing the most expensive component"],"a":1,"e":"One change at a time, test after each — plus signal generators for reference and analyzers for measurement, documenting throughout.","id":388,"s":"study"},{"t":22,"q":"The most likely source of an AV system failure is:","o":["Amplifier failure","Projector failure","Cable or connector failure","Source device failure"],"a":2,"e":"Cables and connectors fail substantially more often than components — bring spares to every service call.","id":389,"s":"study"},{"t":22,"q":"A laptop shows an image on its own screen but not through the projector. A battery-related cause could be:","o":["The battery is interfering with HDMI","Some laptops won't drive both displays on battery power — plug into mains","The projector needs batteries","Battery saver dims the projector lamp"],"a":1,"e":"Some laptops disable dual display on battery; plug in, then toggle the display output and check screensaver/standby settings.","id":390,"s":"study"},{"t":22,"q":"Which is NOT a feedback-control best practice?","o":["Choosing the narrowest practical mic pattern","Keeping the mic close to the sound source","Adding compression to the microphone chain","Muting unused microphone channels"],"a":2,"e":"Compression doesn't fix feedback. Control it with mic pattern/placement, speaker placement, low gain, and muting unused channels.","id":391,"s":"study"},{"t":22,"q":"A conference room's far-end participants hear their own voices back. The design-level cure is:","o":["Bigger loudspeakers","Echo cancellation and clean-feed (mix-minus) capability in the conferencing design","Higher microphone gain","A subwoofer"],"a":1,"e":"Conferencing echo is best solved by designing in echo cancellation and clean feeds; placement and level changes help in the moment.","id":392,"s":"study"},{"t":22,"q":"A touch panel appears dead but is undamaged. Before calling for service, first:","o":["Replace the panel","Touch the screen — it may simply be in screensaver/power-save mode","Rewire the control bus","Reload the firmware"],"a":1,"e":"Touchscreen power-save looks like a lockup; a touch wakes it. (A cracked screen, though, is a safety hazard — don't touch it bare-handed.)","id":393,"s":"study"},{"t":22,"q":"The #1 cause of wireless microphone failure is:","o":["Antenna damage","Dead batteries","Wrong connector","Diaphragm wear"],"a":1,"e":"Replace the batteries first, always. Then verify matching frequencies, interference, range, gain settings, and antenna placement.","id":394,"s":"study"},{"t":22,"q":"Driving a −10 dBV input from a +4 dBu output without a pad produces:","o":["No signal at all","Overload distortion from the level mismatch","Feedback","Improved headroom"],"a":1,"e":"The mismatched signal level overloads the input — insert a pad to attenuate, or match levels properly.","id":395,"s":"study"},{"t":22,"q":"A constant high-frequency hiss ('waterfall' sound) in a live audio system typically indicates:","o":["Poor gain structure","A blown tweeter","Insufficient compression","RF interference"],"a":0,"e":"Inputs set too low with later stages over-gained to compensate — raise input gains to the highest level short of clipping.","id":396,"s":"study"},{"t":22,"q":"Which utility maps the network path between two devices?","o":["ping","traceroute / tracert","arp","ipconfig"],"a":1,"e":"traceroute (tracert on Windows) shows the path; ping tests connectivity, ifconfig/ipconfig diagnoses IP config, arp maps IP↔MAC.","id":397,"s":"study"}]}</script>
<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
     Results tracker. Paste the Google Apps Script web-app URL here to
     turn on auto-submit; leave it empty and the page behaves exactly as
     it did before (copy button only). See tracker/SETUP.md in the repo.
  ------------------------------------------------------------------ */
  var TRACKER_URL = 'https://script.google.com/macros/s/AKfycbwmbERhQn1iTWZ68Ds7zw4fEfGrJ2bssGzwVGMHs-3L9YHbd_6kVyIeA8nDwYNz4HgC/exec';

  var BANK = JSON.parse(document.getElementById('bank').textContent);
  var TOPICS = BANK.topics, ALL = BANK.q;
  var TNAME = {}; TOPICS.forEach(function(t){ TNAME[t.k] = t.n; });

  var S = {
    mode:'quiz', selected:{}, src:{test:true, study:true}, order:[], i:0,
    answered:{}, revealed:false, picked:null, running:false, flipped:false, optOrder:{},
    /* second-chance tracking: pass 1 is the honest score, later passes catch mis-clicks */
    pass:1, base:null, fixed:{}, sessionId:null
  };
  var SRCNAME = {test:'real test', study:'study material'};
  TOPICS.forEach(function(t){ S.selected[t.k] = true; });

  var $ = function(id){ return document.getElementById(id); };
  var view = $('view');

  /* ---------- sidebar ---------- */
  function srcOn(q){ return !!S.src[q.s]; }
  function countFor(k){ var n=0; ALL.forEach(function(q){ if(q.t===k && srcOn(q)) n++; }); return n; }
  function countSrc(s){ var n=0; ALL.forEach(function(q){ if(q.s===s) n++; }); return n; }

  function buildTopics(){
    var box = $('topics'); box.innerHTML=''; var lastPart = null;
    TOPICS.forEach(function(t){
      var n = countFor(t.k);
      if(t.part !== lastPart){
        lastPart = t.part;
        var h = document.createElement('div');
        h.className = 'part-head'; h.textContent = t.part;
        box.appendChild(h);
      }
      var l = document.createElement('label');
      l.className = 'topic';
      l.innerHTML = '<input type="checkbox" checked data-k="'+t.k+'">'+
                    '<span class="tn">'+t.n+'</span>'+
                    '<span class="tc">'+(n || '--')+'</span>';
      l.querySelector('input').addEventListener('change', function(e){
        S.selected[t.k] = e.target.checked; updateCount();
      });
      box.appendChild(l);
    });
    refreshCounts();
  }

  function pool(){ return ALL.filter(function(q){ return S.selected[q.t] && srcOn(q); }); }

  function updateCount(){
    var n = pool().length;
    $('side-count').textContent = n + ' of ' + ALL.length + ' questions selected';
  }

  /* chapter counts follow the source filter, so switching sources re-labels them */
  function refreshCounts(){
    Array.prototype.forEach.call(document.querySelectorAll('#topics .topic'), function(l){
      var box = l.querySelector('input'), k = parseInt(box.dataset.k, 10), n = countFor(k);
      l.querySelector('.tc').textContent = n || '--';
      l.classList.toggle('void', !n);
      box.disabled = !n;
      if(!n) box.checked = false; else box.checked = !!S.selected[k];
      l.title = n ? '' : 'No questions match the current source filter';
    });
    updateCount();
  }

  function setAll(v){
    TOPICS.forEach(function(t){ if(countFor(t.k)) S.selected[t.k]=v; });
    Array.prototype.forEach.call(document.querySelectorAll('#topics input'), function(c){
      if(!c.disabled) c.checked = v;
    });
    updateCount();
  }
  $('all').addEventListener('click', function(){ setAll(true); });
  $('none').addEventListener('click', function(){ setAll(false); });

  $('c-test').textContent = countSrc('test');
  $('c-study').textContent = countSrc('study');
  [['src-test','test'],['src-study','study']].forEach(function(p){
    $(p[0]).addEventListener('change', function(e){
      S.src[p[1]] = e.target.checked;
      /* never let both sources be off — re-check the one just cleared */
      if(!S.src.test && !S.src.study){ S.src[p[1]] = true; e.target.checked = true; }
      refreshCounts();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('#mode-seg button'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#mode-seg button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on'); S.mode = b.dataset.mode;
    });
  });

  function openNav(v){ document.body.classList.toggle('nav-open', v); }
  $('burger').addEventListener('click', function(){ openNav(!document.body.classList.contains('nav-open')); });
  $('scrim').addEventListener('click', function(){ openNav(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') openNav(false); });

  /* ---------- session ---------- */
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function start(list, isRetry){
    var qs = list || pool();
    if(!qs.length){ view.innerHTML = '<div class="card empty">No questions selected. Open the menu and pick at least one chapter.</div>'; return; }
    /* a retry keeps the first pass's score and fix-log; anything else is a fresh session */
    if(isRetry){ S.pass++; } else { S.pass = 1; S.base = null; S.fixed = {}; S.sessionId = newId(); }
    S.order = qs.slice();
    if($('shuffleQ').checked) shuffle(S.order);
    S.optOrder = {};
    S.order.forEach(function(q){
      var idx = q.o.map(function(_,n){ return n; });
      if($('shuffleA').checked) shuffle(idx);
      S.optOrder[q.id] = idx;
    });
    S.i = 0; S.answered = {}; S.revealed = false; S.picked = null; S.flipped = false; S.running = true;
    openNav(false); render();
  }
  $('start').addEventListener('click', function(){ start(null); });
  $('end').addEventListener('click', function(){ if(S.running) results(); });

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---------- render ---------- */
  function render(){
    if(!S.running){ intro(); return; }
    if(S.i >= S.order.length){ results(); return; }
    var q = S.order[S.i];
    var done = Object.keys(S.answered).length;
    var right = 0; for(var k in S.answered){ if(S.answered[k].correct) right++; }
    var pct = Math.round((S.i / S.order.length) * 100);
    var acc = done ? Math.round(right/done*100) + '%' : '--';

    var h = '<div id="bar-wrap">'+
      '<div id="bar-meta"><span>Question <b>'+(S.i+1)+'</b> / '+S.order.length+'</span>'+
      '<span>'+(S.mode==='quiz' ? 'Accuracy <b>'+acc+'</b><span class="detail"> &nbsp;·&nbsp; '+right+' of '+done+' correct</span>' : 'Flashcard mode')+'</span></div>'+
      '<div id="bar"><i style="width:'+pct+'%"></i></div></div>';

    h += '<div class="card"><span class="chip">'+esc(TNAME[q.t])+'</span>'+
         '<p class="qtext">'+esc(q.q)+'</p>';

    if(S.mode === 'card'){
      if(!S.flipped){
        h += '<div class="flip" id="flip">Tap to reveal the answer</div>';
      } else {
        h += '<div class="opts">';
        q.o.forEach(function(o,n){
          h += '<div class="opt locked '+(n===q.a?'right':'dim')+'"><span class="k">'+String.fromCharCode(65+n)+'</span><span>'+esc(o)+'</span></div>';
        });
        h += '</div>';
        h += '<div class="fb tip"><div class="hd">Why</div>'+esc(q.e)+'</div>';
      }
      h += '<div class="nav">';
      if(S.i>0) h += '<button class="btn ghost" id="prev">Back</button>';
      h += '<button class="btn" id="next">'+(S.i===S.order.length-1?'Finish':'Next')+'</button></div>';
    } else {
      var order = S.optOrder[q.id];
      h += '<div class="opts">';
      order.forEach(function(orig, pos){
        var cls = 'opt';
        if(S.revealed){
          cls += ' locked';
          if(orig === q.a) cls += ' right';
          else if(orig === S.picked) cls += ' wrong';
          else cls += ' dim';
        }
        h += '<button class="'+cls+'" data-o="'+orig+'"'+(S.revealed?' disabled':'')+
             '><span class="k">'+String.fromCharCode(65+pos)+'</span><span>'+esc(q.o[orig])+'</span></button>';
      });
      h += '</div>';

      if(S.revealed){
        var ok = S.picked === q.a;
        h += '<div class="fb '+(ok?'ok':'no')+'"><div class="hd">'+(ok?'Correct':'Not quite')+'</div>';
        if(!ok) h += '<div class="ans">Correct answer: <b>'+esc(q.o[q.a])+'</b></div>';
        h += esc(q.e)+'</div>';
        h += '<div class="nav"><button class="btn" id="next">'+(S.i===S.order.length-1?'See results':'Next question')+'</button></div>';
      } else if(S.picked !== null){
        h += '<div class="nav"><button class="btn" id="reveal">Check answer</button></div>';
      }
    }
    h += '</div>';
    view.innerHTML = h;
    wire(q);
    window.scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'auto' : 'auto'});
  }

  function wire(q){
    var f = $('flip');
    if(f) f.addEventListener('click', function(){ S.flipped = true; render(); });

    Array.prototype.forEach.call(document.querySelectorAll('.opt[data-o]'), function(b){
      b.addEventListener('click', function(){
        if(S.revealed) return;
        S.picked = parseInt(b.dataset.o, 10);
        if($('instant').checked) reveal(q); else render();
      });
    });

    var r = $('reveal'); if(r) r.addEventListener('click', function(){ reveal(q); });
    var n = $('next'); if(n) n.addEventListener('click', advance);
    var p = $('prev'); if(p) p.addEventListener('click', function(){ S.i--; S.flipped=false; render(); });
  }

  function reveal(q){
    S.revealed = true;
    S.answered[q.id] = {correct:(S.picked === q.a), chosen:S.picked};
    render();
  }

  function advance(){
    S.i++; S.revealed = false; S.picked = null; S.flipped = false;
    render();
  }

  document.addEventListener('keydown', function(e){
    if(!S.running) return;
    if(e.target && /input|textarea/i.test(e.target.tagName)) return;
    var q = S.order[S.i]; if(!q) return;
    if(S.mode === 'quiz' && !S.revealed && /^[1-9]$/.test(e.key)){
      var pos = parseInt(e.key,10) - 1;
      var order = S.optOrder[q.id];
      if(pos < order.length){ S.picked = order[pos]; if($('instant').checked) reveal(q); else render(); }
    } else if(e.key === 'Enter' || e.key === ' '){
      if(S.mode === 'card' && !S.flipped){ e.preventDefault(); S.flipped = true; render(); }
      else if(S.revealed || S.mode === 'card'){ e.preventDefault(); advance(); }
      else if(S.picked !== null){ e.preventDefault(); reveal(q); }
    }
  });

  /* ---------- results ---------- */
  function results(){
    S.running = false;
    openNav(false);
    var seen = S.order.filter(function(q){ return q.id in S.answered; });
    if(!seen.length){
      /* bailing out of a retry shouldn't discard the first pass */
      if(S.pass > 1){ S.pass--; }
      intro('No questions were answered in that session.');
      return;
    }

    /* Pass 1 is the score of record. Later passes only log which misses got corrected. */
    if(S.pass === 1){
      var snap = {};
      seen.forEach(function(q){ snap[q.id] = {correct:S.answered[q.id].correct, chosen:S.answered[q.id].chosen}; });
      S.base = {seen:seen.slice(), answered:snap};
    } else {
      seen.forEach(function(q){
        if(S.answered[q.id].correct && !(q.id in S.fixed)) S.fixed[q.id] = S.pass;
      });
    }

    var base = S.base;
    var right = base.seen.filter(function(q){ return base.answered[q.id].correct; }).length;
    var pct = Math.round(right / base.seen.length * 100);
    var grade = pct >= 90 ? 'Excellent' : pct >= 75 ? 'Good work' : pct >= 60 ? 'More review needed' : 'Keep studying';

    /* everything first-pass wrong, split by whether a later pass recovered it */
    var origMissed = base.seen.filter(function(q){ return !base.answered[q.id].correct; });
    var slips = origMissed.filter(function(q){ return q.id in S.fixed; });
    var gaps  = origMissed.filter(function(q){ return !(q.id in S.fixed); });

    var by = {}, bySrc = {};
    base.seen.forEach(function(q){
      if(!by[q.t]) by[q.t] = {r:0, n:0};
      by[q.t].n++; if(base.answered[q.id].correct) by[q.t].r++;
      if(!bySrc[q.s]) bySrc[q.s] = {r:0, n:0};
      bySrc[q.s].n++; if(base.answered[q.id].correct) bySrc[q.s].r++;
    });

    var h = '<div class="card">';

    /* ---- the second-chance offer / outcome, above the fold ---- */
    if(S.pass === 1 && origMissed.length){
      h += '<div class="second"><div class="hd">Second chance?</div>'+
           '<p>You missed <b>'+origMissed.length+'</b> question'+(origMissed.length===1?'':'s')+
           '. Run them again to sort the mis-clicks from the things you genuinely don\'t know yet — '+
           'anything you get right on the second look gets flagged as a slip rather than a weak spot. '+
           'Your '+pct+'% above is the score of record either way.</p>'+
           '<div class="nav"><button class="btn" id="retry">Retry the '+origMissed.length+' missed</button>'+
           '<button class="btn ghost" id="skip">No thanks, show results</button></div></div>';
    } else if(S.pass > 1){
      var lastRound = seen.length;
      h += '<div class="second"><span class="pass-chip">Second look &nbsp;·&nbsp; pass '+S.pass+'</span>'+
           '<div class="hd">'+slips.length+' of '+origMissed.length+' recovered</div>'+
           '<p>Of the '+origMissed.length+' you missed on the first pass, you have since answered '+
           slips.length+' correctly. You retried '+lastRound+' this round.</p>'+
           '<div class="rec">'+
           '<div class="rec-col slip"><div class="n">'+slips.length+'</div><div class="lbl">Likely slips</div>'+
           '<div class="note">Right on a second look — you knew these, the first answer was a mis-click or a misread.</div></div>'+
           '<div class="rec-col gap"><div class="n">'+gaps.length+'</div><div class="lbl">Real gaps</div>'+
           '<div class="note">Still wrong after retrying. These are the ones worth logging as weak spots.</div></div>'+
           '</div></div>';
    }

    h += '<div class="score-hero"><div class="big">'+pct+'%</div>'+
         '<div class="sub">'+right+' of '+base.seen.length+' correct &nbsp;·&nbsp; '+esc(grade)+
         (S.pass > 1 ? ' &nbsp;·&nbsp; first pass' : '')+'</div></div>';

    if(S.pass > 1 && slips.length){
      var adj = Math.round((right + slips.length) / base.seen.length * 100);
      h += '<div class="fb tip" style="margin:0 0 22px"><div class="hd">Counting second-look corrections</div>'+
           'You would have scored <b>'+adj+'%</b> ('+(right + slips.length)+'/'+base.seen.length+
           ') if none of the slips had happened. Track the '+pct+'% — but the gap between the two numbers is '+
           'how much of your score is care rather than knowledge.</div>';
    }

    if(Object.keys(bySrc).length > 1){
      h += '<div class="fb tip" style="margin:0 0 22px"><div class="hd">Split by source</div>';
      ['test','study'].forEach(function(k){
        var d = bySrc[k]; if(!d) return;
        h += '<div>'+esc(SRCNAME[k])+': <b>'+d.r+'/'+d.n+'</b> ('+Math.round(d.r/d.n*100)+'%)</div>';
      });
      h += '</div>';
    }

    h += '<div class="side-label" style="margin-bottom:14px">Accuracy by chapter</div><div class="brk">';
    var lp = null;
    TOPICS.forEach(function(t){
      var d = by[t.k]; if(!d) return;
      if(t.part !== lp){ lp = t.part; h += '<div class="part-head brk-part">'+esc(t.part)+'</div>'; }
      var p = Math.round(d.r/d.n*100);
      var col = p >= 80 ? 'var(--teal)' : (p >= 60 ? 'var(--amber)' : 'var(--red)');
      h += '<div class="brk-row"><div class="brk-top"><span>'+esc(t.n)+'</span>'+
           '<span class="pc">'+d.r+'/'+d.n+' &nbsp;'+p+'%</span></div>'+
           '<div class="brk-bar"><i style="width:'+p+'%;background:'+col+'"></i></div></div>';
    });
    h += '</div>';

    function missList(title, list){
      if(!list.length) return '';
      var s = '<div class="miss"><div class="side-label" style="margin-bottom:12px">'+title+' ('+list.length+')</div>';
      list.forEach(function(q){
        s += '<div class="miss-item"><div class="mt">'+esc(TNAME[q.t])+' &nbsp;·&nbsp; '+esc(SRCNAME[q.s])+'</div>'+
             '<div class="mq">'+esc(q.q)+'</div>'+
             '<div class="ma">'+esc(q.o[q.a])+'</div></div>';
      });
      return s + '</div>';
    }

    if(S.pass === 1){
      h += missList('Missed', origMissed);
    } else {
      h += missList('Still missing after retry — real gaps', gaps);
      h += missList('Recovered on a second look — likely slips', slips);
    }

    h += '<div class="nav">';
    if(S.pass > 1 && gaps.length) h += '<button class="btn" id="retry2">Retry the '+gaps.length+' still missed</button>';
    h += '<button class="btn ghost" id="again">New session</button></div>';
    h += '<div class="nav"><button class="btn ghost" id="copy">Copy results summary</button>';
    if(TRACKER_URL) h += '<button class="btn ghost" id="resend">Send to tracker again</button>';
    h += '</div>';
    h += '<div class="tstat" id="tracker-status">'+
         (TRACKER_URL ? '' : 'Tracker not configured — using the copy button. See tracker/SETUP.md.')+
         '</div></div>';

    view.innerHTML = h;

    var payload = buildPayload(base, right, pct, grade, slips, gaps, by, bySrc);
    var rs = $('resend'); if(rs) rs.addEventListener('click', function(){ submitResults(payload); });

    var rt = $('retry'); if(rt) rt.addEventListener('click', function(){ start(origMissed, true); });
    var rt2 = $('retry2'); if(rt2) rt2.addEventListener('click', function(){ start(gaps, true); });
    var sk = $('skip');
    if(sk) sk.addEventListener('click', function(){
      var el = sk.closest('.second'); if(el) el.parentNode.removeChild(el);
    });
    $('again').addEventListener('click', function(){ start(null); });
    $('copy').addEventListener('click', function(){
      copyResults(base.seen, origMissed, slips, gaps, right, pct, grade, by, bySrc);
    });
    window.scrollTo(0,0);

    /* last, and defensively: a tracker problem must never cost you the results card
       or the buttons above — the copy summary stays the fallback either way */
    submitResults(payload);
  }

  /* ---------- results tracker ---------- */
  var QKEY = 'cts_bank_tracker_queue';

  function newId(){
    return 'cts-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
  }

  function readQueue(){
    try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(e){ return []; }
  }
  function writeQueue(q){
    try { localStorage.setItem(QKEY, JSON.stringify(q.slice(-40))); } catch(e){}
  }
  function enqueue(payload){
    var q = readQueue().filter(function(p){ return p.sessionId !== payload.sessionId; });
    q.push(payload); writeQueue(q);
  }
  function dequeue(id){
    writeQueue(readQueue().filter(function(p){ return p.sessionId !== id; }));
  }

  /* text/plain keeps this a "simple" CORS request, so Apps Script never sees a
     preflight it can't answer. Falls back to no-cors, which writes but can't
     confirm — hence the three-state status. */
  function send(payload){
    if(typeof fetch !== 'function') return Promise.reject(new Error('no fetch'));
    return fetch(TRACKER_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){
      if(d && d.ok === false) throw new Error(d.error || 'rejected');
      return 'saved';
    }).catch(function(){
      return fetch(TRACKER_URL, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      }).then(function(){ return 'unconfirmed'; });
    });
  }

  function buildPayload(base, right, pct, grade, slips, gaps, by, bySrc){
    var chapters = {};
    Object.keys(by).forEach(function(k){ chapters[k] = {r:by[k].r, n:by[k].n}; });
    return {
      sessionId: S.sessionId,
      finishedAt: new Date().toISOString(),
      passes: S.pass,
      right: right, total: base.seen.length, pct: pct, grade: grade,
      slips: slips.length, gaps: gaps.length,
      adjustedPct: Math.round((right + slips.length) / base.seen.length * 100),
      testRight:  bySrc.test  ? bySrc.test.r  : 0, testTotal:  bySrc.test  ? bySrc.test.n  : 0,
      studyRight: bySrc.study ? bySrc.study.r : 0, studyTotal: bySrc.study ? bySrc.study.n : 0,
      chapters: chapters,
      gapDetail: gaps.map(function(q){
        return {ch:q.t, src:q.s, q:q.q, a:q.o[q.a]};
      })
    };
  }

  function setStatus(state, msg){
    var el = $('tracker-status');
    if(!el) return;
    el.className = 'tstat ' + state;
    el.textContent = msg;
  }

  function submitResults(payload){
    if(!TRACKER_URL){ return; }
    try {
      enqueue(payload);
      setStatus('pending', 'Saving to tracker…');
      send(payload).then(function(state){
        dequeue(payload.sessionId);
        if(state === 'saved') setStatus('ok', 'Saved to tracker');
        else setStatus('warn', 'Saved (unconfirmed) — check your sheet');
        flushQueue(true);
      }, function(){
        setStatus('bad', "Couldn't reach the tracker — saved locally, will retry");
      });
    } catch(e){
      setStatus('bad', "Couldn't reach the tracker — saved locally, will retry");
    }
  }

  /* fire any sessions stranded by an earlier outage */
  function flushQueue(quiet){
    if(!TRACKER_URL) return;
    try {
      var q = readQueue();
      if(!q.length) return;
      q.forEach(function(p){
        send(p).then(function(){ dequeue(p.sessionId); }, function(){});
      });
      if(!quiet && q.length) setStatus('pending', 'Retrying ' + q.length + ' queued session(s)…');
    } catch(e){}
  }

  /* Plain-text summary in the same shape the Part quizzes emit, so results
     from either page can be pasted straight into the study tracker. */
  function copyResults(seen, missed, slips, gaps, right, pct, grade, by, bySrc){
    var L = [];
    L.push('CTS Question Bank Results - ' + new Date().toLocaleString());
    L.push('Score: ' + right + '/' + seen.length + ' (' + pct + '%) - ' + grade);
    if(S.pass > 1){
      L.push('Second look: ' + slips.length + ' recovered (likely slips), ' +
             gaps.length + ' still missed (real gaps) after ' + (S.pass - 1) +
             ' retry pass' + (S.pass - 1 === 1 ? '' : 'es'));
    }
    if(Object.keys(bySrc).length > 1){
      var parts = [];
      ['test','study'].forEach(function(k){
        var d = bySrc[k]; if(!d) return;
        parts.push(SRCNAME[k] + ' ' + d.r + '/' + d.n + ' (' + Math.round(d.r/d.n*100) + '%)');
      });
      L.push('By source: ' + parts.join('  |  '));
    } else {
      L.push('Source: ' + SRCNAME[seen[0].s] + ' only');
    }
    L.push('');
    L.push('By chapter:');
    TOPICS.forEach(function(t){
      var d = by[t.k]; if(!d) return;
      L.push('  Ch ' + t.k + ' (' + t.n.replace(/^Ch \d+ - /, '') + '): ' +
             d.r + '/' + d.n + ' (' + Math.round(d.r/d.n*100) + '%)');
    });
    function dump(title, list){
      if(!list.length) return;
      L.push('');
      L.push(title + ' (' + list.length + '):');
      list.forEach(function(q){
        var a = S.base.answered[q.id];
        L.push('  [Ch ' + q.t + ' | ' + SRCNAME[q.s] + '] ' + q.q);
        L.push('      Your answer: ' + String.fromCharCode(65 + a.chosen) + '. ' + q.o[a.chosen]);
        L.push('      Correct: ' + String.fromCharCode(65 + q.a) + '. ' + q.o[q.a]);
      });
    }

    if(!missed.length){
      L.push('');
      L.push('No missed questions - perfect score.');
    } else if(S.pass > 1){
      dump('REAL GAPS - still wrong after retry', gaps);
      dump('LIKELY SLIPS - corrected on a second look', slips);
    } else {
      dump('Missed questions', missed);
    }
    var text = L.join('\n');
    var btn = $('copy');
    function flash(msg){ if(!btn) return; var o = btn.textContent; btn.textContent = msg; setTimeout(function(){ btn.textContent = o; }, 1800); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ flash('Copied'); },
                                              function(){ window.prompt('Copy this text:', text); });
    } else {
      window.prompt('Copy this text:', text);
    }
  }

  /* ---------- intro ---------- */
  function intro(msg){
    var h = '<div class="hero"><div class="eyebrow">CTS Practice Exam</div>'+
      '<h1>Question bank</h1>'+
      '<p>'+ALL.length+' practice questions across all 20 exam-guide chapters &mdash; '+
      countSrc('test')+' transcribed from real online practice tests, '+countSrc('study')+' written from the study material. '+
      'Filter by chapter or source in the menu, pick quiz or flashcard mode, and start. '+
      'At the end you can copy a results summary to paste into the study tracker.</p></div>';
    if(msg) h += '<div class="card" style="margin-bottom:18px"><div class="fb tip" style="margin:0"><div class="hd">Note</div>'+esc(msg)+'</div></div>';
    h += '<div class="card"><div class="side-label" style="margin-bottom:14px">Questions by chapter</div><div class="brk">';
    var mx = 1; TOPICS.forEach(function(t){ mx = Math.max(mx, countFor(t.k)); });
    var lp = null, empties = [];
    TOPICS.forEach(function(t){
      var n = countFor(t.k);
      if(!n){ empties.push(t.short); return; }
      if(t.part !== lp){ lp = t.part; h += '<div class="part-head brk-part">'+esc(t.part)+'</div>'; }
      var p = Math.round(n/mx*100);
      h += '<div class="brk-row"><div class="brk-top"><span>'+esc(t.n)+'</span><span class="pc">'+n+'</span></div>'+
           '<div class="brk-bar"><i style="width:'+p+'%;background:var(--teal)"></i></div></div>';
    });
    if(empties.length){
      h += '<div class="fb tip" style="margin-top:18px"><div class="hd">Gaps in this bank</div>'+
           'No questions yet for '+esc(empties.join(', '))+'. Those chapters still need study time — the bank just hasn\'t covered them.</div>';
    }
    h += '</div><div class="nav"><button class="btn" id="go">Start session</button>'+
         '<button class="btn ghost" id="opts">Choose chapters</button></div></div>';
    view.innerHTML = h;
    $('go').addEventListener('click', function(){ start(null); });
    $('opts').addEventListener('click', function(){ openNav(true); });
  }

  buildTopics();
  intro();
  flushQueue(true);
})();
</script>
</body>
</html>
